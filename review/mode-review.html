<!-- ═══════════════════════════════════════════════════════════════════════
     MODE REVIEW — dipisah dari review/riwayat-modals.html jadi file sendiri.
     Di-load ke #review-modals-root (lihat REVIEW_PAGE_MODULES di
     index_review.html), sama seperti riwayat-modals.html — dipakai bersama
     oleh dock Akun & Riwayat.

     Perilaku:
     - Saat overlay ini "open" (lihat openModal/closeModal di index_review.html),
       dock/taskbar bawah otomatis disembunyikan via body.mrv-active .dock-wrap.
     - Desktop/tablet (>768px): navigasi soal tampil sebagai sidebar 200px di
       kanan, sama seperti sebelumnya.
     - Mobile (≤768px): sidebar disembunyikan, diganti tombol grid di header
       yang membuka drawer slide-in dari kanan — pola yang SAMA dipakai di
       ujian.html (#mob-nav-overlay/#mob-nav-slide), supaya "MODE REVIEW"
       terasa senada dengan tampilan saat mengerjakan ujian. Elemen di drawer
       (mrv-mob-nav-grid/mrv-mob-legend/mrv-mob-sub-score) diisi bareng dengan
       versi desktop dari review/riwayat.js (lihat _mrvSetAll()), bukan re-render
       terpisah, supaya selalu sinkron.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
#review-ujian-overlay{padding:0;align-items:stretch;}
.mrv-wrap{width:100%;max-width:100%;height:100%;display:flex;flex-direction:column;background:rgba(232,238,246,0.97);position:relative;}

.mrv-header{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1.5px solid rgba(255,255,255,0.85);box-shadow:0 2px 12px rgba(19,50,89,0.08);gap:12px;}
.mrv-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mrv-logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-size:12px;font-weight:800;}
.mrv-logo-txt{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--blue);}
#ruv-title{flex:1;font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--blue);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;}
.mrv-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mrv-score-box{background:rgba(19,50,89,0.07);border-radius:8px;padding:6px 12px;text-align:center;}
.mrv-score-lbl{font-size:9px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.06em;}
#ruv-sub-score{font-family:var(--font-head);font-size:16px;font-weight:800;color:var(--blue);}
.mrv-btn-close,.mrv-btn-mobnav{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.mrv-btn-close{border:1.5px solid rgba(220,38,38,0.2);background:rgba(220,38,38,0.09);color:var(--danger);}
.mrv-btn-mobnav{display:none;border:1.5px solid rgba(19,50,89,0.12);background:rgba(255,255,255,0.7);color:var(--blue);}

#ruv-sub-tabs{display:flex;gap:4px;padding:8px 16px;background:rgba(255,255,255,0.6);border-bottom:1px solid rgba(19,50,89,0.07);overflow-x:auto;flex-shrink:0;}

.mrv-body{flex:1;display:flex;overflow:hidden;}
.mrv-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:16px 20px 14px;}
#ruv-content{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-bottom:16px;}
#ruv-content img,#mrv-mob-slide img{max-width:100%;height:auto;display:block;border-radius:8px;margin:6px 0;object-fit:contain;}
#ruv-content{overflow-wrap:break-word;}
#ruv-nav-btns{background:rgba(255,255,255,0.6);border:1.5px solid rgba(255,255,255,0.85);border-radius:16px;padding:14px 18px;box-shadow:0 4px 14px rgba(19,50,89,0.05);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}

/* Sidebar navigasi (desktop/tablet) */
.mrv-sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;padding:14px 14px 14px 0;gap:10px;}
.mrv-nav-box{background:rgba(255,255,255,0.72);border:1.5px solid rgba(255,255,255,0.9);border-radius:13px;padding:12px;box-shadow:0 3px 12px rgba(19,50,89,0.06);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.mrv-nav-box-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0;}
.mrv-nav-box-ttl{font-size:10px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.07em;}
#ruv-q-counter{font-size:10px;font-weight:700;color:var(--accent);background:rgba(26,90,160,0.08);border-radius:5px;padding:2px 6px;}
#ruv-nav-grid{display:flex;flex-wrap:wrap;gap:4px;overflow-y:auto;flex:1;align-content:flex-start;padding-right:2px;}
#ruv-legend{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(19,50,89,0.06);flex-shrink:0;}
.mrv-btn-download{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:10px;font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;}

/* Drawer navigasi mobile (meniru #mob-nav-overlay/#mob-nav-slide di ujian.html) */
#mrv-mob-overlay{display:none;position:fixed;inset:0;z-index:410;background:rgba(19,50,89,0.3);backdrop-filter:blur(4px);}
#mrv-mob-overlay.open{display:block;}
#mrv-mob-slide{position:fixed;top:0;right:0;bottom:0;width:270px;max-width:82vw;background:rgba(255,255,255,0.97);backdrop-filter:blur(30px);border-left:1.5px solid rgba(255,255,255,0.9);box-shadow:-8px 0 32px rgba(19,50,89,0.14);z-index:411;display:flex;flex-direction:column;padding:14px;transform:translateX(100%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);}
#mrv-mob-slide.open{transform:translateX(0);}
.mrv-mob-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.mrv-mob-ttl{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--blue);}
.mrv-btn-close-mob{width:28px;height:28px;border-radius:50%;border:none;background:rgba(19,50,89,0.08);color:var(--text-sub);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
.mrv-mob-score{background:rgba(19,50,89,0.05);border-radius:10px;padding:8px;text-align:center;margin-bottom:10px;}
.mrv-mob-score-lbl{font-size:9px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.06em;}
#mrv-mob-sub-score{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--blue);}
#mrv-mob-nav-grid{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;}
#mrv-mob-legend{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px solid rgba(19,50,89,0.06);margin-top:8px;}

/* ── MOBILE (≤768px): sidebar navigasi jadi drawer slide-in, sama seperti ujian.html ── */
@media(max-width:768px){
  .mrv-sidebar{display:none!important;}
  .mrv-btn-mobnav{display:flex!important;}
  .mrv-logo-txt{display:none;}
  .mrv-main{padding:10px;}
}

/* ── Dock disembunyikan total selama MODE REVIEW aktif (lihat openModal/closeModal
     di index_review.html yang toggle class ini ke <body>) ── */
body.mrv-active .dock-wrap{display:none!important;}
</style>

<div class="overlay" id="review-ujian-overlay">
  <div class="mrv-wrap">
    <!-- Header -->
    <div class="mrv-header">
      <div class="mrv-logo">
        <div class="mrv-logo-mark">R</div>
        <span class="mrv-logo-txt">MODE REVIEW</span>
      </div>
      <div id="ruv-title"></div>
      <div class="mrv-header-right">
        <div class="mrv-score-box">
          <div class="mrv-score-lbl">Nilai Sub</div>
          <div id="ruv-sub-score">-</div>
        </div>
        <button class="mrv-btn-mobnav" onclick="openMrvMobNav()" aria-label="Buka navigasi soal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="mrv-btn-close" onclick="closeModal('review-ujian-overlay')" aria-label="Tutup mode review">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Sub Tes Tabs -->
    <div id="ruv-sub-tabs"></div>

    <!-- Body (mirip ujian.html) -->
    <div class="mrv-body">
      <!-- Konten Soal -->
      <div class="mrv-main">
        <div id="ruv-content"></div>
        <div id="ruv-nav-btns"></div>
      </div>
      <!-- Sidebar Nav (desktop/tablet — mirip ujian.html) -->
      <div class="mrv-sidebar">
        <div class="mrv-nav-box">
          <div class="mrv-nav-box-hdr">
            <span class="mrv-nav-box-ttl">Navigasi</span>
            <span id="ruv-q-counter">0/0</span>
          </div>
          <div id="ruv-nav-grid"></div>
          <div id="ruv-legend"></div>
        </div>
        <!-- Download button -->
        <button class="mrv-btn-download" onclick="downloadFromReviewUjian()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Drawer navigasi soal khusus mobile MODE REVIEW (pola sama seperti ujian.html) -->
<div id="mrv-mob-overlay" onclick="closeMrvMobNav()"></div>
<div id="mrv-mob-slide">
  <div class="mrv-mob-hdr">
    <span class="mrv-mob-ttl">Navigasi Soal</span>
    <button class="mrv-btn-close-mob" onclick="closeMrvMobNav()">&times;</button>
  </div>
  <div class="mrv-mob-score">
    <div class="mrv-mob-score-lbl">Nilai Sub</div>
    <div id="mrv-mob-sub-score">-</div>
  </div>
  <div id="mrv-mob-nav-grid"></div>
  <div id="mrv-mob-legend"></div>
  <button class="mrv-btn-download" style="margin-top:10px" onclick="downloadFromReviewUjian()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download
  </button>
</div>
