<!-- ══════════════════════════════════════════════════════════════════════
     review/bahas/bahas.html — dock BAHAS (guru).
     Nampilin 1 kartu ringkas SESI MENTORING TERDEKAT yang mau dimulai
     dalam waktu dekat (lihat BAHAS_THRESHOLD_MENIT di bahas.js), isinya
     persis 3 hal: (1) resume jadwal, (2) link Gmeet, (3) tombol BAHAS yang
     lompat ke MODE REVIEW (openReviewUjian, sama persis kayak tombol
     "Review" di tab Riwayat) untuk siswa & sesi itu. Kalau tidak ada jadwal
     yang tinggal beberapa menit lagi, kartu ini kosong (empty state).
     Struktur/CSS card & status badge sengaja dibuat mirip
     #home-jadwal-next-card (widget "Sesi Mentoring Terdekat" di sisi user,
     lihat user/index_user.html) supaya konsisten secara visual dgn fitur
     jadwal yang sudah ada. ══════════════════════════════════════════════ -->
<div class="section-title">Bahas</div>
<div class="section-sub">Sesi mentoring yang akan dimulai</div>

<div class="empty-state" id="bahas-empty">

  <p>Belum ada sesi yang akan dimulai</p>

</div>

  <div class="bahas-card-title" id="bahas-nama">-</div>

  <div class="bahas-card-actions">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 10l5-3v10l-5-3"/><rect x="1" y="6" width="14" height="12" rx="2"/></svg>
