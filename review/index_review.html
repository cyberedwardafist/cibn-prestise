<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Panel — CIBN PRESTISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/taskbar.css">
<link rel="stylesheet" href="css/custom-select.css">
<style>
/* ── REVIEW SPECIFIC STYLES ── */
.review-user-card{
  background:rgba(255,255,255,0.65);
  border:1.5px solid rgba(255,255,255,0.85);
  border-radius:14px;
  padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  margin-bottom:8px;
  box-shadow:0 2px 10px rgba(19,50,89,0.05);
  transition:all 0.2s;
}
.review-user-card:hover{background:rgba(255,255,255,0.85);box-shadow:0 4px 16px rgba(19,50,89,0.1);}
.user-avatar{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-head);font-size:16px;font-weight:800;
}
.user-info{flex:1;min-width:0;}
.user-name{font-weight:700;font-size:14px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-email{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-actions{display:flex;gap:6px;flex-shrink:0;}

.grub-header{
  font-family:var(--font-head);font-size:14px;font-weight:700;
  color:var(--blue);padding:10px 0 6px;
  border-bottom:1.5px solid rgba(19,50,89,0.08);
  margin-bottom:10px;margin-top:6px;
  display:flex;align-items:center;gap:8px;
}
.grub-badge{
  background:rgba(19,50,89,0.07);
  color:var(--text-sub);border-radius:20px;
  padding:2px 10px;font-size:11px;font-weight:600;
}

/* LAPORAN MODAL */
.lap-skor-big{
  font-family:var(--font-head);font-size:52px;font-weight:800;
  color:var(--blue);text-align:center;margin-bottom:4px;
}
.lap-skor-sub{text-align:center;font-size:13px;color:var(--text-sub);margin-bottom:16px;}
.lap-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.lap-card{background:rgba(19,50,89,0.04);border-radius:12px;padding:12px;text-align:center;}
.lap-card-val{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--blue);}
.lap-card-label{font-size:11px;color:var(--text-sub);font-weight:600;}

.lap-soal-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.lap-soal-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:rgba(19,50,89,0.03);border-radius:10px;
  cursor:pointer;transition:all 0.18s;
}
.lap-soal-item:hover{background:rgba(19,50,89,0.07);}
.lap-soal-name{font-size:13px;font-weight:600;color:var(--blue);}
.lap-soal-skor{font-family:var(--font-head);font-size:16px;font-weight:800;}
.lap-soal-skor.ok{color:var(--success);}
.lap-soal-skor.no{color:var(--danger);}

/* REVIEW SOAL MODAL (like ujian but readonly) */
.rv-layout{display:flex;gap:16px;height:600px;max-height:70vh;}
.rv-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.rv-right{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
.rv-q-box{background:rgba(19,50,89,0.03);border:1.5px solid rgba(19,50,89,0.09);border-radius:14px;padding:16px;overflow-wrap:break-word;}
.rv-a-box{display:flex;flex-direction:column;gap:7px;overflow-wrap:break-word;}
#rsv-body img{max-width:100%;height:auto;display:block;border-radius:8px;margin:6px 0;object-fit:contain;}
.rv-option{
  display:flex;align-items:center;gap:10px;
  padding:10px 13px;border-radius:11px;
  border:1.5px solid rgba(19,50,89,0.09);
  background:rgba(255,255,255,0.5);font-size:14px;
}
.rv-option.correct{border-color:var(--success);background:rgba(22,163,74,0.08);}
.rv-option.wrong{border-color:var(--danger);background:rgba(220,38,38,0.07);}
.rv-option.key-only{border-color:#d97706;background:rgba(217,119,6,0.08);}
.rv-letter{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;
  background:rgba(19,50,89,0.07);color:var(--text-sub);
}
.rv-option.correct .rv-letter{background:var(--success);color:#fff;}
.rv-option.wrong .rv-letter{background:var(--danger);color:#fff;}
.rv-option.key-only .rv-letter{background:#d97706;color:#fff;}

.rv-nav-grid{display:flex;flex-wrap:wrap;gap:5px;overflow-y:auto;}
.rv-nav-btn{
  width:30px;height:30px;border-radius:7px;
  border:1.5px solid rgba(19,50,89,0.12);
  background:rgba(255,255,255,0.7);
  font-size:11px;font-weight:700;color:var(--text-sub);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.rv-nav-btn.current{background:var(--blue);color:#fff;border-color:var(--blue);}
.rv-nav-btn.correct{background:rgba(22,163,74,0.15);border-color:var(--success);color:var(--success);}
.rv-nav-btn.wrong{background:rgba(220,38,38,0.12);border-color:var(--danger);color:var(--danger);}
.rv-nav-btn.empty{background:rgba(19,50,89,0.05);color:rgba(19,50,89,0.3);}

.rv-pembahasan{
  background:rgba(26,90,160,0.05);
  border:1.5px solid rgba(26,90,160,0.12);
  border-radius:10px;padding:12px;margin-top:4px;
}
.rv-pemb-label{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;}

/* SK Review */
.rv-sk-card{padding:16px;}
.rv-sk-items{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.rv-sk-item{
  background:rgba(19,50,89,0.04);border-radius:8px;
  min-height:44px;display:flex;align-items:center;justify-content:center;
  font-size:16px;text-align:center;padding:6px;
}
.rv-sk-q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.rv-sk-q-item{
  background:rgba(255,255,255,0.6);border:1.5px solid rgba(19,50,89,0.09);border-radius:8px;
  min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:6px;
}
.rv-sk-choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.rv-sk-choice{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;border-radius:10px;border:1.5px solid rgba(19,50,89,0.09);
  background:rgba(255,255,255,0.5);
}
.rv-sk-choice.correct{border-color:var(--success);background:rgba(22,163,74,0.09);}
.rv-sk-choice.wrong{border-color:var(--danger);background:rgba(220,38,38,0.07);}
.rv-sk-choice.key{border-color:#d97706;background:rgba(217,119,6,0.08);}
.rv-sk-letter{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:rgba(19,50,89,0.07);color:var(--text-sub);}
.rv-sk-choice.correct .rv-sk-letter{background:var(--success);color:#fff;}
.rv-sk-choice.wrong .rv-sk-letter{background:var(--danger);color:#fff;}
.rv-sk-choice.key .rv-sk-letter{background:#d97706;color:#fff;}

/* HOME REVIEW */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:rgba(255,255,255,0.65);border:1.5px solid rgba(255,255,255,0.9);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(19,50,89,0.05);}
.stat-val{font-family:var(--font-head);font-size:32px;font-weight:800;color:var(--blue);}
.stat-label{font-size:12px;color:var(--text-sub);font-weight:600;margin-top:2px;}

/* AKUN SAYA */
.profile-card{background:rgba(255,255,255,0.65);border:1.5px solid rgba(255,255,255,0.9);border-radius:16px;padding:24px;max-width:480px;margin:0 auto;}
.profile-avatar{
  width:64px;height:64px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-size:26px;font-weight:800;color:#fff;
  margin:0 auto 16px;
}

/* Chart */
.chart-wrap{background:rgba(255,255,255,0.6);border:1.5px solid rgba(255,255,255,0.85);border-radius:12px;padding:14px;margin-bottom:12px;}

@media(max-width:640px){
  .rv-layout{flex-direction:column;height:auto;}
  .rv-right{width:100%;}
  .rv-nav-grid{flex-direction:row;flex-wrap:wrap;}
  .lap-cards{grid-template-columns:1fr 1fr;}
  .user-actions .hide-mobile{display:none;}
}
/* Dock overflow – fallback jika taskbar.css belum punya */
.dock-sep{width:1px;height:32px;background:rgba(19,50,89,.1);margin:0 2px;flex-shrink:0}
.dock-more{position:relative;display:flex;align-items:center}
.dock-more-menu{position:absolute;bottom:calc(100% + 12px);right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 8px 30px rgba(19,50,89,.14);padding:6px;min-width:160px;z-index:200;display:none}
.dock-more-menu.open{display:block}
.dock-more-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;border-radius:9px;background:transparent;color:var(--blue);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;text-align:left}
.dock-more-item:hover{background:rgba(19,50,89,.07)}
.dock-more-item svg{width:16px;height:16px;flex-shrink:0;color:var(--text-sub)}

/* ─── PAGE: EBOOK LIBRARY ─── */
.ebook-header-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ebook-count{font-size:11.5px;color:var(--text-sub);font-weight:600;white-space:nowrap}
.ebook-detail-header{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.ebook-detail-title{font-family:var(--font-head);font-weight:700;font-size:15px;color:var(--blue);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebook-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}
.ebook-search-wrap{position:relative;flex:1;min-width:180px}
.ebook-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-sub);pointer-events:none}
.ebook-search-input{width:100%;padding:10px 34px 10px 36px;border-radius:12px;border:1.5px solid rgba(19,50,89,.12);background:rgba(255,255,255,.55);font-family:var(--font-body);font-size:13.5px;color:var(--text-main);outline:none;transition:border-color .2s,background .2s}
.ebook-search-input:focus{border-color:var(--accent);background:rgba(255,255,255,.8)}
.ebook-search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;border-radius:50%;background:rgba(19,50,89,.08);color:var(--text-sub);display:none;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.ebook-search-clear.show{display:flex}
.ebook-search-clear:hover{background:rgba(19,50,89,.16)}
.ebook-search-clear:focus-visible,.ebk-clear-filter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ebook-kelompok-select{padding:10px 12px;border-radius:12px;border:1.5px solid rgba(19,50,89,.12);background:rgba(255,255,255,.55);font-family:var(--font-body);font-size:12.5px;color:var(--text-main);outline:none;max-width:170px;cursor:pointer;transition:border-color .2s}
.ebook-kelompok-select:focus{border-color:var(--accent)}
#ebook-kelompok-filter-wrap{max-width:170px}
.ebook-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px}
.ebook-card{position:relative;background:rgba(255,255,255,.65);border:1.5px solid rgba(255,255,255,.85);border-radius:5px 14px 14px 5px;overflow:hidden;box-shadow:2px 3px 10px rgba(19,50,89,.08);cursor:pointer;transition:transform .28s cubic-bezier(.22,.8,.32,1),box-shadow .28s;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
.ebook-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--ebk-spine,var(--accent));z-index:2}
.ebook-card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:5px 12px 26px rgba(19,50,89,.18)}
.ebook-card:active{transform:translateY(-1px) scale(.98)}
.ebook-poster{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,rgba(19,50,89,.08),rgba(26,90,160,.14));display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden;flex-shrink:0;position:relative}
.ebook-poster::after{content:'';position:absolute;top:3%;right:0;bottom:3%;width:5px;background:repeating-linear-gradient(180deg,rgba(19,50,89,.18) 0 1px,transparent 1px 3px);opacity:.65}
.ebook-poster img{width:100%;height:100%;object-fit:cover}
.ebook-poster svg{width:30px;height:30px;opacity:.5;filter:drop-shadow(0 2px 3px rgba(19,50,89,.15))}
.ebook-card-body{padding:9px 12px 11px 11px;display:flex;flex-direction:column;gap:3px}
.ebook-card-nama{font-weight:700;font-size:12.5px;color:var(--blue);line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ebook-card-kelompok{font-size:9.5px;color:var(--ebk-spine,var(--accent));font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ebook-card-meta{font-size:10.5px;color:var(--text-sub);display:flex;align-items:center;gap:4px;margin-top:2px}
.ebook-card-meta svg{flex-shrink:0}
.empty-state .ebk-empty-actions{margin-top:10px}
.empty-state button.ebk-clear-filter{padding:7px 16px;border-radius:10px;border:1.5px solid rgba(19,50,89,.15);background:rgba(255,255,255,.6);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:background .2s}
.empty-state button.ebk-clear-filter:hover{background:rgba(255,255,255,.9)}
.empty-state small{display:block;margin-top:4px;font-size:12px}

/* ─── E-BOOK READER (fullscreen overlay) ─── */
.ebook-reader-overlay{position:fixed;inset:0;z-index:900;background:#eef2f8;display:none;flex-direction:column;opacity:0;transform:scale(.98);transition:opacity .28s ease,transform .28s ease}
.ebook-reader-overlay.open{display:flex;opacity:1;transform:scale(1)}
.ebook-reader-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(19,50,89,.08);flex-shrink:0;z-index:2}
.ebook-reader-back,.ebook-zoom-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;border:none;background:rgba(19,50,89,.06);color:var(--blue);cursor:pointer;flex-shrink:0;transition:background .2s}
.ebook-reader-back:hover,.ebook-zoom-btn:hover{background:rgba(19,50,89,.12)}
.ebook-zoom-btn:disabled{opacity:.3;cursor:default;background:rgba(19,50,89,.06)!important}
.ebook-zoom-controls{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ebook-zoom-label{font-size:11px;font-weight:700;color:var(--text-sub);min-width:38px;text-align:center;user-select:none}
.ebook-reader-title{flex:1;min-width:0;font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebook-reader-page-ind{font-size:11.5px;color:var(--text-sub);font-weight:600;flex-shrink:0;min-width:40px;text-align:center}
.ebook-reader-progress{height:2.5px;background:rgba(19,50,89,.08);flex-shrink:0;position:relative;z-index:2}
.ebook-reader-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}
.ebook-reader-body{flex:1;position:relative;overflow:hidden;background:#aeb9c8;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ebook-reader-swipe{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.ebook-reader-swipe.ebk-zoomed{touch-action:auto}
.ebook-swipe-track{display:flex;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.22,.8,.36,1)}
.ebook-swipe-page{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.ebook-page-canvas-wrap{position:relative;box-shadow:0 1px 4px rgba(19,50,89,.28);border-radius:1px;overflow:hidden;background:#fff;max-width:100%;max-height:100%;min-width:0;min-height:0;flex-shrink:0;margin:auto;transition:width .18s ease,height .18s ease}
.ebook-reader-swipe.ebk-zoomed .ebook-page-canvas-wrap{max-width:none;max-height:none}
.ebook-page-canvas-wrap canvas{display:block;max-width:100%;max-height:100%;-webkit-user-drag:none;user-drag:none;pointer-events:none}
.ebook-reader-swipe.ebk-zoomed .ebook-page-canvas-wrap canvas{max-width:none;max-height:none}
.ebook-page-placeholder{width:min(97vw,1000px);aspect-ratio:3/4.2;background:rgba(255,255,255,.6);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);font-size:11px;transition:none}
.ebook-swipe-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(19,50,89,.18);z-index:3;opacity:.9;transition:opacity .2s,background .2s}
.ebook-swipe-arrow:hover{opacity:1;background:rgba(255,255,255,.95)}
.ebook-swipe-arrow.left{left:10px}
.ebook-swipe-arrow.right{right:10px}
.ebook-swipe-arrow:disabled{opacity:.25;cursor:default}
.ebook-reader-blurcover{position:absolute;inset:0;background:rgba(230,236,245,.98);backdrop-filter:blur(30px);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text-sub);font-size:12.5px;text-align:center;padding:20px}
.ebook-reader-body.ebk-blurred .ebook-reader-blurcover{display:flex}
.ebook-reader-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-sub);font-size:13px;z-index:5}
.ebk-spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(19,50,89,.15);border-top-color:var(--accent);animation:ebkspin .8s linear infinite}
@keyframes ebkspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
    .ebook-card,.ebook-reader-overlay,.ebook-reader-progress-fill,.ebook-swipe-track{transition:none!important}
    .ebook-card:hover{transform:none}
}

/* ══════════════════════════════════════════════════════════════════════
   TAB JADWAL — disalin persis dari user/index_user.html supaya tampilan &
   perilakunya SAMA PERSIS dengan tab Jadwal di akun user (lihat
   review/jadwal/jadwal.html & review/jadwal/jadwal.js, hasil salinan dari
   user/jadwal/*). Variabel warna (--blue, --accent, dst) sudah tersedia
   lewat css/base.css yang di-link di head halaman ini, jadi tidak perlu
   didefinisikan ulang. Class swipe-card/.swipe-list yang dipakai list
   status Jadwal juga sudah ada di css/base.css (dipakai bareng oleh
   review/akun & admin), jadi tidak ikut disalin ke sini. ══════════════ */
    /* ─── PAGE: JADWAL ─── */
    #page-jadwal { align-items:stretch; padding-top:24px; }
    .jadwal-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .jadwal-title { font-family:var(--font-head); font-size:22px; font-weight:700; color:var(--blue); }
    .jadwal-empty { text-align:center; padding:48px 24px; color:var(--text-sub); }
    .jadwal-empty svg { width:52px; height:52px; margin-bottom:12px; opacity:.28; }
    .jadwal-empty p { font-size:14px; margin-bottom:4px; font-weight:600; }
    .jadwal-empty small { font-size:12px; }
    .jadwal-refresh-btn { display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:10px; border:1.5px solid rgba(19,50,89,.12); background:rgba(255,255,255,.5); cursor:pointer; font-size:12px; font-weight:600; color:var(--blue); transition:all .2s; }
    .jadwal-refresh-btn:hover { background:rgba(255,255,255,.8); }
    .jadwal-refresh-btn svg { width:13px; height:13px; }
    /* Badge KUOTA PENGAJUAN — gantiin tombol Reset Dummy/Refresh di header
       tab Jadwal (lihat user/jadwal.html & _jdwRenderKuota di user/jadwal.js). */
    .jadwal-kuota-badge { display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:20px; border:1.5px solid rgba(26,90,160,.18); background:rgba(26,90,160,.08); color:var(--accent); font-family:var(--font-body); font-size:11.5px; font-weight:600; white-space:nowrap; }
    .jadwal-kuota-badge svg { width:14px; height:14px; flex-shrink:0; }
    .jadwal-kuota-badge strong { font-family:var(--font-head); font-weight:700; color:var(--blue); }
    /* Grup dua badge (kuota pengajuan + kuota pembatalan) ditumpuk vertikal
       di pojok kanan header — lihat user/jadwal.html & _jdwRenderKuota di
       user/jadwal.js (satu fungsi yang sama update dua-duanya sekaligus). */
    .jadwal-kuota-group { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .jadwal-kuota-badge.batal { border-color:rgba(220,38,38,.2); background:rgba(220,38,38,.08); color:var(--danger); }
    .jadwal-kuota-badge.batal strong { color:var(--danger); }

    /* ── JADWAL: kalender 1 minggu ala iPhone ── */
    .jdw-week-card { padding:18px 10px 14px; margin-bottom:12px; }
    .jdw-week-caption { font-size:11px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; text-align:center; }
    .jdw-week-strip { display:flex; justify-content:space-between; gap:2px; }
    .jdw-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 2px 8px; border-radius:14px; cursor:pointer; transition:background .2s; -webkit-tap-highlight-color:transparent; }
    .jdw-day:hover { background:rgba(19,50,89,.05); }
    .jdw-day-name { font-size:10px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.02em; }
    .jdw-day-num-wrap { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-size:14px; font-weight:700; color:var(--blue); position:relative; transition:all .2s; }
    .jdw-day.is-today .jdw-day-num-wrap { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 12px rgba(26,90,160,.35); }
    .jdw-day.has-entries .jdw-day-num-wrap::after { content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
    .jdw-day.is-today.has-entries .jdw-day-num-wrap::after { background:#fff; }
    .jdw-day.is-past { opacity:.4; cursor:pointer; }
    .jdw-day.is-past .jdw-day-num-wrap { background:rgba(19,50,89,.05); }
    .jdw-day.is-future-locked { opacity:.35; cursor:default; }
    .jdw-day.is-riwayat-disabled { opacity:.35; cursor:default; }
    .jdw-day.is-riwayat-selected .jdw-day-num-wrap { border:2px solid var(--accent); }
    .jdw-week-hint { text-align:center; font-size:11.5px; color:var(--text-sub); margin-top:2px; margin-bottom:4px; }

    /* ── JADWAL: tombol buka tampilan sebulan (di kalender utama & kalender
       mini Jadwal Ulang) + grid kalender sebulan (6 baris x 7 kolom, ala
       kalender biasa). Tanggal "numpang lewat" dari bulan sebelum/sesudah
       (.is-outside) TIDAK BISA diklik — cuma buat rapiin grid jadi 6 baris —
       sama seperti tanggal yang sudah lewat (.is-past), keduanya sengaja
       tanpa atribut onclick sama sekali (bukan cuma didisable lewat CSS). ── */
    /* min-height dikunci ke tinggi tombol toggle (~28px) supaya baris ini
       TETAP punya tinggi yang sama biarpun caption di dalamnya di-hide
       (display:none) pas mode sebulan lagi aktif (lihat _jdwRenderWeek) —
       tanpa ini baris collapse ke ~0px & tombol (position:absolute, jadi
       tidak ikut ngasih tinggi ke baris) numpuk langsung nempel ke elemen
       sesudahnya (id=jdw-cal-nav), nggak ada jarak sama sekali. */
    .jdw-week-caption-row { position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:12px; min-height:28px; }
    .jdw-week-caption-row .jdw-week-caption { margin-bottom:0; }
    .jdw-cal-toggle-btn { position:absolute; right:0; top:50%; transform:translateY(-50%); display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; border:1.5px solid rgba(19,50,89,.12); background:rgba(255,255,255,.55); color:var(--accent); font-family:var(--font-body); font-size:10.5px; font-weight:700; cursor:pointer; transition:all .2s; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    .jdw-cal-toggle-btn:hover { background:rgba(255,255,255,.9); }
    .jdw-cal-toggle-btn.active { border-color:var(--accent); background:rgba(26,90,160,.1); }
    .jdw-cal-toggle-btn svg { width:13px; height:13px; flex-shrink:0; }
    .jdw-form-label-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .jdw-form-label-row .jdw-form-label { margin-bottom:0; }
    .jdw-month-grid { margin-top:2px; }
    .jdw-month-weekdays { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
    .jdw-month-weekdays span { text-align:center; font-size:10px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.02em; }
    .jdw-month-cells { display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; }
    .jdw-mcell { display:flex; align-items:center; justify-content:center; padding:2px 0; -webkit-tap-highlight-color:transparent; }
    .jdw-mcell-num { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-size:12.5px; font-weight:700; color:var(--blue); position:relative; transition:all .2s; }
    .jdw-mcell[onclick] { cursor:pointer; }
    .jdw-mcell[onclick]:hover .jdw-mcell-num { background:rgba(19,50,89,.05); }
    .jdw-mcell.is-today .jdw-mcell-num { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 12px rgba(26,90,160,.35); }
    .jdw-mcell.is-selected .jdw-mcell-num { box-shadow:inset 0 0 0 2px var(--accent); }
    .jdw-mcell.has-entries .jdw-mcell-num::after { content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
    .jdw-mcell.is-today.has-entries .jdw-mcell-num::after { background:#fff; }
    .jdw-mcell.is-past .jdw-mcell-num { opacity:.35; }
    .jdw-mcell.is-outside { cursor:default; }
    .jdw-mcell.is-outside .jdw-mcell-num { opacity:.18; }
    .jdw-mcell.is-outside-unlocked .jdw-mcell-num { opacity:.55; }

    /* ── JADWAL: toggle Minggu Ini / Riwayat + nav minggu (riwayat) ── */
    .jdw-view-toggle { display:flex; gap:8px; margin:14px 0 12px; }
    .jdw-view-btn { flex:1; padding:10px 12px; border-radius:12px; border:1.5px solid rgba(19,50,89,.12); background:rgba(255,255,255,.55); color:var(--blue); font-family:var(--font-body); font-size:12.5px; font-weight:700; cursor:pointer; transition:all .2s; -webkit-tap-highlight-color:transparent; }
    .jdw-view-btn:hover { background:rgba(255,255,255,.85); }
    .jdw-view-btn.active { border-color:transparent; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 14px rgba(26,90,160,.3); }
    .jdw-riwayat-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .jdw-riwayat-caption { flex:1; text-align:center; font-family:var(--font-head); font-size:13px; font-weight:700; color:var(--blue); }
    .jdw-icon-btn:disabled { opacity:.35; cursor:not-allowed; }

    /* ── JADWAL: list pengajuan menunggu/disetujui, dipisah per hari (ala Token Terpakai admin) ── */
    .jdw-status-list { display:flex; flex-direction:column; gap:16px; padding-bottom:4px; }
    .jdw-status-day-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; padding:0 2px; }
    .jdw-status-day-label { font-family:var(--font-head); font-size:12.5px; font-weight:700; color:var(--blue); }
    .jdw-status-day-today { display:inline-block; margin-left:6px; font-family:var(--font-body); font-size:10px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); padding:2px 8px; border-radius:20px; vertical-align:middle; }
    .jdw-status-day-count { font-size:11px; font-weight:700; color:var(--text-sub); white-space:nowrap; flex-shrink:0; }
    .jdw-status-day-empty { font-size:12px; color:var(--text-sub); padding:13px 14px; border-radius:12px; background:rgba(19,50,89,.04); border:1.5px dashed rgba(19,50,89,.14); text-align:center; }

    /* ── JADWAL: halaman fullscreen (detail tanggal & form ajukan) ── */
    .overlay-fullscreen { padding:0; align-items:stretch; justify-content:stretch; background:var(--bg); backdrop-filter:none; }
    /* overflow:hidden + overscroll-behavior:contain di sini supaya efek
       rubber-band/bounce pas scroll di dalam .jdw-modal-body (khususnya di
       Safari iOS) nggak "bocor" nampilin background di belakang modal (blob
       animasi dll) — jadi walau di-scroll sampai mental, yang kelihatan tetap
       background var(--bg) yang sama, nggak ada ruang kosong yang beda warna. */
    .modal-fullscreen { width:100%; max-width:100%; height:100%; max-height:100%; border-radius:0; padding:0; margin:0; display:flex; flex-direction:column; background:var(--bg); backdrop-filter:none; border:none; box-shadow:none; transform:none; overflow:hidden; overscroll-behavior:contain; }
    .overlay-fullscreen.open .modal-fullscreen { transform:none; }
    /* Header & body sengaja dibikin SATU warna background (var(--bg), sama
       kayak .modal-fullscreen) dan border pemisahnya dilepas — supaya
       nyambung/menyatu jadi satu permukaan, bukan dua panel kepotong. Header
       tetap sticky biar judul & tombol back tetap keliatan pas discroll. */
    .jdw-modal-header { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; background:var(--bg); position:sticky; top:0; z-index:2; }
    .jdw-modal-title { font-family:var(--font-head); font-size:16px; font-weight:700; color:var(--blue); flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .jdw-modal-title-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
    .jdw-modal-title-wrap .jdw-modal-title { flex:none; }
    .jdw-modal-subtitle { font-size:11px; font-weight:600; color:var(--text-sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
    .jdw-modal-subtitle:empty { display:none; }
    /* min-height:100% + background var(--bg) sendiri (nggak cuma ngandelin
       warna dari parent) supaya background body SELALU penuh se-layar,
       walaupun kontennya pendek atau lagi di-scroll/overscroll — nggak ada
       lagi ruang kosong di bawah yang keliatan beda/nggak sinkron. */
    .jdw-modal-body { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding:36px 16px 28px; width:100%; max-width:640px; margin:0 auto; box-sizing:border-box; background:var(--bg); min-height:100%; }
    /* Ajukan Jadwal: tombol AJUKAN sekarang ikut di dalam area scroll (bukan
       footer sticky lagi) — kasih padding-bottom ekstra biar begitu discroll
       sampai habis, tombolnya berhenti di posisi nyaman di atas dock utama
       (sama kayak jarak aman 100px yang dipakai .page buat konten lain). */
    /* 140px = sama kayak jarak aman dock yang dipakai #page-jadwal (bukan 100px
       generik punya .page lain) -- sekarang dock kelihatan/dipakai lagi di atas
       overlay ini (lihat body.jdw-fullscreen-open di atas), jadi tombol AJUKAN di
       ujung scroll harus berhenti di atas dock, bukan ketutup olehnya. */
    #jdw-ajukan-overlay .jdw-modal-body { padding-bottom:calc(200px + env(safe-area-inset-bottom)); }
    #jdw-tentor-overlay .jdw-modal-body { padding-bottom:calc(200px + env(safe-area-inset-bottom)); }
    #jdw-resejuel-overlay .jdw-modal-body, #jdw-batal-tentor-overlay .jdw-modal-body { padding-bottom:calc(200px + env(safe-area-inset-bottom)); }
    .jdw-ajukan-submit-section { margin-top:4px; }
    /* Overlay Ajukan Jadwal (#jdw-ajukan-overlay) & Pilih Tentor (#jdw-tentor-overlay)
       bisa "open" BARENGAN (buka Pilih Tentor tidak menutup Ajukan Jadwal
       dulu) — pin z-index eksplisit di sini biar Pilih Tentor SELALU tampil
       di atas Ajukan Jadwal, TIDAK bergantung urutan DOM/urutan fetch sama
       sekali (jaga-jaga tambahan di luar urutan loading yang sudah dipastikan
       sequential di ensureUserPageModule). */
    #jdw-tentor-overlay { z-index:201; }
    .jdw-modal-footer { flex-shrink:0; padding:14px 16px; background:var(--bg); position:sticky; bottom:0; z-index:2; }

    /* ── JADWAL: tombol & badge status generik (self-contained, tidak bergantung css/base.css) ── */
    .jdw-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:11px; border:none; font-family:var(--font-body); font-size:12.5px; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .jdw-btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 14px rgba(26,90,160,.3); }
    .jdw-btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(26,90,160,.4); }
    .jdw-btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .jdw-btn-secondary { background:rgba(19,50,89,.07); color:var(--blue); border:1.5px solid rgba(19,50,89,.12); }
    .jdw-btn-secondary:hover { background:rgba(19,50,89,.12); }
    .jdw-btn-danger { background:rgba(220,38,38,.08); color:var(--danger); border:1.5px solid rgba(220,38,38,.15); }
    .jdw-btn-danger:hover { background:rgba(220,38,38,.15); }
    .jdw-btn-sm { padding:6px 12px; font-size:11px; border-radius:9px; }
    .jdw-btn-block { width:100%; justify-content:center; }
    .jdw-icon-btn { width:34px; height:34px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(19,50,89,.07); color:var(--blue); border:1.5px solid rgba(19,50,89,.1); cursor:pointer; transition:all .2s; flex-shrink:0; }
    .jdw-icon-btn:hover { background:rgba(19,50,89,.14); }
    .jdw-icon-btn svg { width:16px; height:16px; }
    .jdw-status-badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; flex-shrink:0; white-space:nowrap; display:inline-block; }
    .jdw-status-badge.pending { background:rgba(217,119,6,.12); color:var(--warning); }
    .jdw-status-badge.acc { background:rgba(22,163,74,.12); color:var(--success); }
    .jdw-status-badge.ditolak { background:rgba(220,38,38,.12); color:var(--danger); }
    .jdw-status-badge.berlangsung { background:rgba(26,90,160,.12); color:var(--accent); }
    .jdw-status-badge.selesai { background:rgba(90,122,154,.14); color:var(--text-sub); }
    .jdw-status-badge.pengajuan_pembatalan { background:rgba(220,38,38,.10); color:var(--danger); }
    .jdw-status-badge.resejuel { background:rgba(124,58,237,.12); color:#7c3aed; }
    .jdw-status-badge.batal { background:rgba(90,122,154,.14); color:var(--text-sub); }
    .jdw-status-badge.butuh_persetujuan { background:rgba(220,38,38,.10); color:var(--danger); }
    .jdw-status-badge.pengajuan_batal_tentor { background:rgba(124,58,237,.12); color:#7c3aed; }
    .jdw-status-badge.feedback { background:rgba(217,119,6,.12); color:var(--warning); }

    /* ── JADWAL: halaman fullscreen bandingkan jadwal lama vs baru (resejuel) —
       resume LAMA (diajukan user) di atas, resume BARU (diajukan tentor,
       termasuk alasan tentor) di bawah, tiap resume nampilin nama tentornya
       juga. Susunan vertikal ini KHUSUS mobile — di desktop disusun
       berdampingan, lihat @media (min-width:769px) di bawah. ── */
    .jdw-resejuel-compare { display:flex; flex-direction:column; align-items:stretch; gap:2px; margin:2px 0 18px; }
    .jdw-resejuel-item { padding:14px 16px; border-radius:14px; background:rgba(19,50,89,.04); border:1.5px solid rgba(19,50,89,.1); }
    .jdw-resejuel-item.new { background:rgba(124,58,237,.06); border-color:rgba(124,58,237,.25); }
    .jdw-resejuel-item-label { font-size:10.5px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.02em; margin-bottom:5px; }
    .jdw-resejuel-item.new .jdw-resejuel-item-label { color:#7c3aed; }
    .jdw-resejuel-item-date { font-family:var(--font-head); font-size:13.5px; font-weight:700; color:var(--blue); margin-bottom:3px; }
    .jdw-resejuel-item-row { font-size:12px; color:var(--text-sub); font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .jdw-resejuel-item-dot { opacity:.5; }
    .jdw-resejuel-item-tentor { font-size:12px; color:var(--blue); font-weight:700; }
    .jdw-resejuel-item-alasan { margin-top:10px; padding-top:10px; border-top:1px dashed rgba(19,50,89,.14); font-size:12px; color:var(--text-sub); font-weight:600; line-height:1.5; }
    .jdw-resejuel-item.new .jdw-resejuel-item-alasan { border-top-color:rgba(124,58,237,.2); }
    .jdw-resejuel-item-alasan-label { display:block; font-size:10.5px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.02em; margin-bottom:4px; }
    .jdw-resejuel-arrow { display:flex; justify-content:center; color:#7c3aed; margin:2px 0; }
    .jdw-resejuel-arrow svg { width:18px; height:18px; }
    /* Tombol Tolak/Setuju berdampingan, ditaruh di ujung bawah body (bukan
       footer sticky) — sama pola kayak tombol AJUKAN di halaman Ajukan
       Jadwal, biar ikut kescroll & berhenti di atas dock utama. */
    .jdw-resejuel-actions { display:flex; gap:10px; margin-top:4px; }
    .jdw-resejuel-actions .jdw-btn { flex:1; justify-content:center; }
    /* ── JADWAL: layar desktop (lebih luas) — resume lama & baru disusun
       BERDAMPINGAN (lama di kiri, baru di kanan) alih-alih ditumpuk vertikal,
       panahnya diputar jadi horizontal, tetap di antara keduanya, tetap
       mengarah dari jadwal lama ke jadwal baru. ── */
    @media (min-width:769px) {
        .jdw-resejuel-compare { flex-direction:row; align-items:stretch; gap:16px; }
        .jdw-resejuel-item { flex:1; }
        .jdw-resejuel-arrow { align-self:center; margin:0; flex-shrink:0; }
        .jdw-resejuel-arrow svg { transform:rotate(-90deg); }
    }

    /* ── JADWAL: tabel desktop untuk daftar pengajuan ── */
    .jdw-entry-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
    .jdw-entry-table th { text-align:left; padding:9px 12px; font-size:11px; color:var(--text-sub); border-bottom:1.5px solid rgba(19,50,89,.08); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .jdw-entry-table td { padding:11px 12px; border-bottom:1px solid rgba(19,50,89,.06); vertical-align:middle; overflow-wrap:break-word; }
    .jdw-entry-table tr:last-child td { border-bottom:none; }
    .jdw-entry-table th:nth-child(1), .jdw-entry-table td:nth-child(1) { width:13%; }
    .jdw-entry-table th:nth-child(2), .jdw-entry-table td:nth-child(2) { width:12%; }
    .jdw-entry-table th:nth-child(3), .jdw-entry-table td:nth-child(3) { width:20%; }
    .jdw-entry-table th:nth-child(4), .jdw-entry-table td:nth-child(4) { width:20%; }
    .jdw-entry-table th:nth-child(5), .jdw-entry-table td:nth-child(5) { width:35%; }

    /* ── JADWAL: halaman "Sesi Berlangsung" (Masuk) & "Feedback Sesi" ── */
    .jdw-sesi-item { padding:16px; border-radius:14px; background:rgba(255,255,255,.6); border:1.5px solid rgba(19,50,89,.1); margin-bottom:14px; }
    .jdw-sesi-item-label { font-size:11px; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px; }
    .jdw-sesi-item-row { display:flex; align-items:center; gap:10px; }
    .jdw-sesi-item-value { flex:1; min-width:0; font-family:var(--font-body); font-size:13.5px; font-weight:700; color:var(--blue); word-break:break-all; }
    .jdw-sesi-item-value.mono { font-family:monospace; letter-spacing:.1em; }
    .jdw-sesi-copy-btn { width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:11px; border:1.5px solid rgba(19,50,89,.12); background:rgba(19,50,89,.06); color:var(--accent); cursor:pointer; transition:all .2s; -webkit-tap-highlight-color:transparent; }
    .jdw-sesi-copy-btn:hover { background:rgba(26,90,160,.12); }
    .jdw-sesi-copy-btn svg { width:16px; height:16px; }

<!-- Tab lain (akun, riwayat, ebook, akun-saya) TIDAK dimuat di sini lagi — masing-masing
     (HTML + JS + modal) di-fetch dari server hanya saat tab-nya benar-benar dibuka.
     Lihat ensureReviewPageModule() di bawah, dipanggil dari renderPage(). -->
<script>
/* ══════════════════════════════════════════════════
   REVIEW PANEL — Core JS (Enhanced with main.html features)
══════════════════════════════════════════════════ */
const API_BASE = window.location.origin + '/api';
const AppState = { currentPage: 'home' };

/* ══════════════════════════════════════════════════
   GLOBAL STATE untuk Review Ujian (dari main.html)
══════════════════════════════════════════════════ */
let _currentReviewLaporan = null; // laporan yang sedang dibuka
let _currentReviewUser = null;    // user yang sedang dilihat
let _rvExamState = {
  soal: null,
  jawaban: {},
  subResults: [],
  currentSubIdx: 0,
  currentSub: null,
  questions: [],
  currentQIdx: 0,
  type: 'normal'
};

/* ── NAV ── */
function navigateTo(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active-tab'));
  const page = document.getElementById('page-' + pageId);
  if (page) page.classList.add('active');
  const dock = document.querySelector(`[data-page="${pageId}"]`);
  if (dock) dock.classList.add('active-tab');
  AppState.currentPage = pageId;
  try { localStorage.setItem('cbn_review_lastpage', pageId); } catch(e) {}
  renderPage(pageId);
}

function renderPage(id) {
  ensureReviewPageModule(id).then(() => {
    if (id === 'home') renderHome();
    else if (id === 'akun') renderAkun();
    else if (id === 'riwayat') renderRiwayat();
    else if (id === 'akun-saya') renderAkunSaya();
    else if (id === 'ebook') EbookLib.load();
    else if (id === 'jadwal') loadJadwal();
    // halaman baru (kosong, siap diisi)
    // else if (id === 'keuangan') renderKeuangan();
    // else if (id === 'bahas') renderBahas();
    // else if (id === 'laporan') renderLaporan();
  }).catch(err => {
    console.error('[lazy-load] Gagal memuat modul halaman "'+id+'":', err);
    showToast('Gagal memuat halaman ini, coba muat ulang', 'danger');
  });
}

// ── LAZY-LOAD PER TAB ────────────────────────────────────────────────────
// 'home' tidak ada di sini karena sudah dimuat eager (bagian dari script ini).
// keuangan/bahas/laporan belum diimplementasikan (lihat renderPage di atas)
// jadi tidak butuh modul apa pun.
const REVIEW_PAGE_MODULES = {
    // akun butuh review/riwayat.js juga: tombol "Lihat Riwayat" di daftar user
    // manggil openRiwayatUser() yang didefinisikan di riwayat.js. Modal-nya
    // (riwayat-user-overlay, laporan-overlay, dst) sekarang ada di file terpisah
    // (review/riwayat-modals.html) yang di-load ke #review-modals-root — bukan
    // ke dalam #page-akun / #page-riwayat — karena keduanya dipakai bersama oleh
    // dock Akun & Riwayat. Ditandai needsModals supaya dock manapun yang dibuka
    // duluan tetap bisa memicu modal ini. "MODE REVIEW" (review-ujian-overlay)
    // juga dipecah jadi file sendiri (review/mode-review.html) dengan alasan sama.
    akun:       { html: 'review/akun/akun.html',           js: ['review/riwayat/riwayat.js', 'review/akun/akun.js'], needsModals: true },
    riwayat:    { html: 'review/riwayat/riwayat.html',      js: ['review/riwayat/riwayat.js'], needsModals: true },
    'akun-saya':{ html: 'review/akun-saya/akun-saya.html',  js: ['review/akun-saya/akun-saya.js'] },
    ebook:      { html: 'review/ebook/ebook.html',          js: ['review/ebook/ebook.js'] },
    // jadwal: disalin persis dari USER_PAGE_MODULES.jadwal di user/index_user.html
    // — shell (jadwal.html) + tiap overlay/aksi dipecah jadi file sendiri
    // (htmlAppend), di-append SATU-SATU (bukan bareng) ke #jdw-overlays-root
    // (di LUAR #page-jadwal) biar overlay fullscreen-nya beneran fixed ke
    // layar & urutan tumpukannya konsisten. Lihat catatan panjangnya di
    // user/index_user.html dekat #jdw-overlays-root & USER_PAGE_MODULES.jadwal.
    jadwal: {
        html: 'review/jadwal/jadwal.html',
        htmlAppend: [
            'review/jadwal/jadwal-ajukan.html',
            'review/jadwal/jadwal-tentor.html',
            'review/jadwal/jadwal-sesi.html',
            'review/jadwal/jadwal-batal.html',
        ],
        htmlAppendTarget: 'jdw-overlays-root',
        js: ['review/jadwal/jadwal.js'],
    },
};
// Fragmen modal bersama (dipakai lintas dock) yang di-load ke #review-modals-root.
// append:true + URL yang sama dari dock manapun -> LazyLoader hanya benar-benar
// fetch/inject SEKALI (di-cache per URL), aman dipanggil berulang dari 2 dock.
const REVIEW_SHARED_MODALS = ['review/riwayat/riwayat-modals.html', 'review/riwayat/mode-review.html'];
function ensureReviewPageModule(pageId) {
    const spec = REVIEW_PAGE_MODULES[pageId];
    if (!spec) return Promise.resolve();
    const container = document.getElementById('page-' + pageId);
    // Shell utama (spec.html) HARUS selesai ngisi innerHTML container dulu,
    // baru fragmen overlay (spec.htmlAppend) di-APPEND sesudahnya — kalau
    // dijalanin bareng, ada resiko innerHTML shell nimpa balik fragmen
    // overlay yang keburu di-append duluan (race condition). Sama pola
    // kayak ensureUserPageModule() di user/index_user.html.
    const mainLoad = container
        ? LazyLoader.loadMany([{ url: '/' + spec.html, container }])
        : Promise.resolve();
    return mainLoad.then(async () => {
        if (spec.htmlAppend) {
            const appendTarget = spec.htmlAppendTarget ? document.getElementById(spec.htmlAppendTarget) : container;
            if (appendTarget) {
                for (const url of spec.htmlAppend) {
                    await LazyLoader.loadMany([{ url: '/' + url, container: appendTarget, append: true }]);
                }
            }
        }
        if (spec.needsModals) {
            const modalsRoot = document.getElementById('review-modals-root');
            if (modalsRoot) {
                for (const url of REVIEW_SHARED_MODALS) {
                    await LazyLoader.loadMany([{ url: '/' + url, container: modalsRoot, append: true }]);
                }
            }
        }
        return LazyLoader.loadMany(spec.js.map(url => ({ url: '/' + url })));
    });
}

function openModal(id) {
  document.getElementById(id)?.classList.add('open');
  // "MODE REVIEW" (review-ujian-overlay) tampil fullscreen — dock/taskbar bawah
  // otomatis disembunyikan selama overlay ini aktif (lihat body.mrv-active di
  // review/mode-review.html). Dicek di sini (bukan di tombol yang manggilnya)
  // supaya konsisten tertutup lewat jalur manapun (tombol X, klik backdrop, dst).
  if (id === 'review-ujian-overlay') document.body.classList.add('mrv-active');
}
function closeModal(id) {
  document.getElementById(id)?.classList.remove('open');
  if (id === 'review-ujian-overlay') {
    document.body.classList.remove('mrv-active');
    // Pastikan drawer navigasi mobile ikut ketutup kalau masih terbuka saat MODE REVIEW ditutup.
    if (typeof closeMrvMobNav === 'function') closeMrvMobNav();
  }
}

function showToast(msg, type = '') {
  let t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (type ? ' ' + type : '');
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function getAuthHeaders() {
  const token = localStorage.getItem('cbn_token');
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

async function apiFetch(path, opts = {}) {
  const headers = getAuthHeaders();
  const res = await fetch(API_BASE + path, { ...opts, headers: {...headers, ...(opts.headers||{})} });
  return res.json();
}

    document.getElementById('stat-user').textContent = users.length;
    document.getElementById('stat-lap').textContent = laporan.length;

    document.getElementById('stat-avg').textContent = avg;

    const recent = laporan.slice(-5).reverse();
    document.getElementById('home-recent').innerHTML = recent.length
      ? recent.map(l => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(19,50,89,0.06)">
          <div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--blue)">${l.user_nama || l.user_kode}</div><div style="font-size:11px;color:var(--text-sub)">${l.modul_nama || l.modul_kode} · ${formatDate(l.tgl_selesai)}</div></div>
          <div style="font-family:var(--font-head);font-size:18px;font-weight:800;color:${(l.skor||0)>=60?'var(--success)':'var(--danger)'}">${Math.round(l.skor||0)}</div>

function formatDate(s) { if(!s) return '-'; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateTime(s) { if(!s) return '-'; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function filterList(arr,q,fields){if(!q)return arr;const ql=q.toLowerCase();return arr.filter(item=>fields.some(f=>item[f]&&String(item[f]).toLowerCase().includes(ql)));}

/* ── DOWNLOAD (Enhanced dengan modal format pilihan) ── */

function setupMainDockOverflow() {
  const dock = document.getElementById('main-dock');
  if (!dock) return;
  const moreWrap = document.getElementById('dock-more-wrap');
  const moreMenu = document.getElementById('dock-more-menu');
  const sep      = document.getElementById('main-dock-sep');
  if (!moreWrap || !moreMenu) return;

  const overflowItems = [...dock.querySelectorAll('.dock-overflow-item')];

  function update() {
    overflowItems.forEach(el => { el.style.display = ''; });
    moreWrap.style.display = 'none';
    if (sep) sep.style.display = '';

    moreWrap.style.visibility = 'hidden';
    moreWrap.style.display = '';

    let attempts = 0;
    while (dock.scrollWidth > dock.offsetWidth && attempts < overflowItems.length) {
      const visible = overflowItems.filter(el => el.style.display !== 'none');
      if (!visible.length) break;
      visible[visible.length - 1].style.display = 'none';
      attempts++;
    }
    moreWrap.style.visibility = '';

    const hiddenItems = overflowItems.filter(el => el.style.display === 'none');
    if (hiddenItems.length === 0) {
      moreWrap.style.display = 'none';
      if (sep) sep.style.display = '';
    } else {
      moreWrap.style.display = '';
      const anyVisible = overflowItems.some(el => el.style.display !== 'none');
      if (sep) sep.style.display = anyVisible ? '' : 'none';
      moreMenu.innerHTML = hiddenItems.map(btn => {
        const page  = btn.dataset.page;
        const label = btn.querySelector('.dock-label')?.textContent ?? page;
        const svg   = btn.querySelector('.dock-icon svg')?.outerHTML ?? '';
        return `<button class="dock-more-item" onclick="navigateTo('${page}');closeDockMore()">${svg}${label}</button>`;
      }).join('');
    }
  }

  new ResizeObserver(update).observe(dock);
  update();
  setTimeout(update, 300);
}

function toggleDockMore() {
  document.getElementById('dock-more-menu')?.classList.toggle('open');
}
function closeDockMore() {
  document.getElementById('dock-more-menu')?.classList.remove('open');
}
document.addEventListener('click', e => {
  const btn  = document.getElementById('btn-dock-more');
  const menu = document.getElementById('dock-more-menu');
  if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) closeDockMore();
});

document.addEventListener('DOMContentLoaded', () => {
  setupMainDockOverflow();
});
