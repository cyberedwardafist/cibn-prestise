<!-- modal fragments (riwayat feature) -->
<div class="overlay" id="riwayat-user-overlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="rwu-title">Riwayat User</div>
      <button class="modal-close" onclick="closeModal('riwayat-user-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="rwu-body"></div>
    </div>
  </div>
</div>
<div class="overlay" id="laporan-overlay">
  <div class="modal modal-xl">
    <div class="modal-header">
      <div class="modal-title" id="lap-title">Laporan Ujian</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-secondary btn-sm" onclick="downloadLaporan()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <button class="modal-close" onclick="closeModal('laporan-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <div class="modal-body" id="lap-body"></div>
  </div>
</div>
<div class="overlay" id="review-soal-overlay">
  <div class="modal modal-xl" style="max-height:95vh;">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="rsv-title">Review Soal</div>
        <div style="font-size:11px;color:var(--text-sub)" id="rsv-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal('review-soal-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="rsv-body" style="overflow-y:auto;max-height:calc(95vh - 100px);"></div>
  </div>
</div>
<div class="overlay" id="download-overlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Unduh Laporan</div>
      <button class="modal-close" onclick="closeModal('download-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <button class="btn btn-primary" onclick="doDownload('all','word')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
          Semua (Word)
        </button>
        <button class="btn btn-secondary" onclick="doDownload('all','excel')" style="border-color:rgba(22,163,74,0.3);color:var(--success)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          Semua (Excel)
        </button>
      </div>

      <div id="dl-per-soal-list" style="display:flex;flex-direction:column;gap:6px;"></div>
      
    </div>
  </div>
</div>
<div class="overlay" id="grub-dl-overlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Unduh Laporan Grup</div>
      <button class="modal-close" onclick="closeModal('grub-dl-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Grup Token</label>
        <div style="font-size:14px;font-weight:700;color:var(--blue)" id="grub-dl-nama">-</div>
        <div style="font-size:11px;color:var(--text-sub)" id="grub-dl-count">-</div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Urutan Soal &amp; Jawaban</label>
        <div style="display:flex;gap:8px">
          <button type="button" class="token-mode-btn sub-tab active" id="grub-dl-mode-default" onclick="_setGrubDlMode('default')" style="flex:1">Urutan Default</button>
          <button type="button" class="token-mode-btn sub-tab" id="grub-dl-mode-acak" onclick="_setGrubDlMode('acak')" style="flex:1">Sesuai Saat Ujian</button>
        </div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:6px" id="grub-dl-mode-desc">Nomor soal &amp; pilihan jawaban dikembalikan ke posisi asli di bank soal (soal nomor 1 tetap nomor 1, pilihan A tetap A).</div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Format File</label>
        <div style="display:flex;gap:8px">
          <button type="button" class="token-mode-btn sub-tab active" id="grub-dl-format-word" onclick="_setGrubDlFormat('word')" style="flex:1">Word (.doc)</button>
          <button type="button" class="token-mode-btn sub-tab" id="grub-dl-format-excel" onclick="_setGrubDlFormat('excel')" style="flex:1">Excel (.xlsx)</button>
        </div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:6px" id="grub-dl-format-desc">Setiap laporan peserta akan disimpan sebagai file Word (.doc) di dalam ZIP.</div>
      </div>
      <button class="btn btn-primary" style="width:100%" id="grub-dl-btn" onclick="prosesUnduhLaporanGrup()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Unduh ZIP
      </button>
      <div id="grub-dl-progress" style="font-size:11px;color:var(--text-sub);text-align:center;display:none"></div>
    </div>
  </div>
</div>
