<!-- ══════════════════════════════════════════════════════════════════════
     review/laporan/laporan-form.html — overlay isi/lihat Laporan
     Pembelajaran untuk 1 sesi mentoring yang sudah selesai.
     SENGAJA ditaruh di #laporan-overlays-root (LUAR #page-laporan) — alasan
     sama persis kayak #jdw-overlays-root/#review-modals-root: #page-laporan
     pakai class .page yang punya `transform` (animasi pindah tab), kalau
     overlay position:fixed ditaruh JADI ANAK elemen yang ber-transform,
     browser nganggap dia fixed relatif ke kotak elemen itu, bukan ke layar
     sungguhan. ═══════════════════════════════════════════════════════════ -->
<div class="overlay overlay-fullscreen" id="lap-form-overlay">
  <div class="modal modal-fullscreen">
    <div class="jdw-modal-header">
      <button class="jdw-icon-btn" onclick="LaporanPage.closeForm()" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="jdw-modal-title" id="lap-form-title">Laporan Pembelajaran</div>
      <span style="width:32px"></span>
    </div>
    <div class="jdw-modal-body">
      <div class="jdw-sesi-item-label" style="margin-bottom:10px">Resume Jadwal</div>
      <div class="jdw-sesi-item" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px"><span style="color:var(--text-sub)">Murid</span><span style="font-weight:700;color:var(--blue);text-align:right" id="lap-form-nama">-</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px"><span style="color:var(--text-sub)">Tanggal</span><span style="font-weight:700;color:var(--blue);text-align:right" id="lap-form-tanggal">-</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px"><span style="color:var(--text-sub)">Jam</span><span style="font-weight:700;color:var(--blue);text-align:right" id="lap-form-slot">-</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span style="color:var(--text-sub)">Materi</span><span style="font-weight:700;color:var(--blue);text-align:right" id="lap-form-materi">-</span></div>
      </div>

      <div class="jdw-sesi-item-label" style="margin-bottom:10px">Laporan Pembelajaran</div>
      <textarea class="jdw-textarea" id="lap-form-textarea" style="min-height:160px" placeholder="Tulis rangkuman pembelajaran, materi yang dibahas, progres siswa, dst..."></textarea>
    </div>
    <div class="jdw-modal-footer">
      <button class="jdw-btn jdw-btn-primary jdw-btn-block" onclick="LaporanPage.confirmSave()">SIMPAN</button>
    </div>
  </div>
</div>
