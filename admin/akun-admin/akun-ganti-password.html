<!-- ══ AKUN SAYA > GANTI PASSWORD ══
     Dulu 2 field password ini nempel di .card halaman Akun Saya langsung
     (bareng nama/email), sekarang dipisah jadi halaman sendiri — dibuka dari
     tombol "Ganti Password" di admin/akun-admin/akun-admin.html. Submit ke
     PUT /api/user/password (endpoint khusus ganti password, TIDAK numpang
     PUT /api/me lagi) via MeAPI.updatePassword() di js/api.js. -->
<button class="btn btn-secondary" style="margin-bottom:14px" onclick="navigateTo('akun-admin')">&larr; Kembali</button>
<div class="section-title">Ganti Password</div>
<div class="section-sub">Masukkan password baru 2x untuk konfirmasi</div>
<div class="card">
  <div class="form-group">
    <label class="form-label">Password Baru</label>
    <div style="position:relative"><input id="agp-pw" class="form-input" type="password" placeholder="Password baru" oninput="setDirty()"><button type="button" onclick="togglePwVis('agp-pw',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-sub);width:22px;height:22px;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </div>
  <div class="form-group">
    <label class="form-label">Konfirmasi Password</label>
    <div style="position:relative"><input id="agp-pwk" class="form-input" type="password" placeholder="Ulangi password baru" oninput="setDirty()"><button type="button" onclick="togglePwVis('agp-pwk',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-sub);width:22px;height:22px;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </div>
  <button class="btn btn-primary" style="width:100%" onclick="submitAkunGantiPassword()">Simpan Password Baru</button>
</div>
