<!-- ══ AKUN SAYA > PENGATURAN ══
     Ganti nama & email admin. Dulu ada di .card halaman Akun Saya langsung
     (bareng password), sekarang dipisah jadi halaman sendiri — dibuka dari
     tombol "Pengaturan" di admin/akun-admin/akun-admin.html.
     Tombol "Ajukan" di bawah baru placeholder (belum ada fungsinya, tunggu
     spesifikasi lanjutan) — sengaja disabled dgn tooltip supaya jelas belum
     aktif, bukan tombol rusak. -->
<button class="btn btn-secondary" style="margin-bottom:14px" onclick="navigateTo('akun-admin')">&larr; Kembali</button>
<div class="section-title">Pengaturan</div>
<div class="section-sub">Ganti nama lengkap dan email akun</div>
<div class="card">
  <div class="form-group"><label class="form-label">Nama Lengkap</label><input id="ap-nama" class="form-input" type="text" oninput="setDirty('profil akun')"></div>
  <div class="form-group"><label class="form-label">Email</label><input id="ap-email" class="form-input" type="email" oninput="setDirty()"></div>
  <button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="submitAkunPengaturan()">Simpan Perubahan</button>
  <button class="btn btn-secondary" style="width:100%" title="Belum tersedia" onclick="ajukanPengaturan()">Ajukan</button>
</div>
