<!-- token-qr-overlay -->
<div class="overlay" id="token-qr-overlay"><div class="modal modal-sm" style="text-align:center"><div class="modal-header"><div class="modal-title">QR Code Token</div><button class="modal-close" onclick="closeModal('token-qr-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><canvas id="qr-canvas-popup" style="width:200px;height:200px;border-radius:12px;border:2px solid rgba(19,50,89,0.1);display:block;margin:0 auto 12px"></canvas><div id="qr-token-code" style="font-family:monospace;font-size:15px;font-weight:700;letter-spacing:0.08em;color:var(--blue);margin-bottom:4px"></div><div id="qr-modul-name" style="font-size:12px;color:var(--text-sub);margin-bottom:16px"></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary btn-sm" onclick="downloadTokenQR()">Download</button><button class="btn btn-secondary btn-sm" onclick="copyTokenCode()">Salin Kode</button></div></div></div>

<!-- token-copy-overlay -->
<div class="overlay" id="token-copy-overlay"><div class="modal modal-sm"><div class="modal-header"><div class="modal-title">Salin Token</div><button class="modal-close" onclick="closeModal('token-copy-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div style="background:rgba(19,50,89,0.04);border-radius:12px;padding:14px;margin-bottom:16px"><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Kode Token</div><div id="copy-token-kode" style="font-family:monospace;font-size:16px;font-weight:700;color:var(--blue);letter-spacing:0.08em"></div><div style="font-size:11px;color:var(--text-sub);margin-top:10px;margin-bottom:2px">Modul</div><div id="copy-token-modul" style="font-size:13px;font-weight:600;color:var(--blue)"></div><div style="font-size:11px;color:var(--text-sub);margin-top:10px;margin-bottom:2px">Waktu Aktif</div><div id="copy-token-waktu" style="font-size:12px;color:var(--blue)"></div></div><div style="display:flex;gap:10px"><button class="btn btn-secondary" style="flex:1" onclick="copyKodeSaja()">Salin Kode</button><button class="btn btn-primary" style="flex:1" onclick="copyList()">Salin Lengkap</button></div></div></div>

<!-- token-used-data-overlay -->
<div class="overlay" id="token-used-data-overlay"><div class="modal modal-sm"><div class="modal-header"><div class="modal-title">Data Pemakaian Token</div><button class="modal-close" onclick="closeModal('token-used-data-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div style="background:rgba(19,50,89,0.04);border-radius:12px;padding:14px"><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Kode Token</div><div id="tud-kode" style="font-family:monospace;font-size:15px;font-weight:700;color:var(--blue);letter-spacing:0.08em;margin-bottom:10px"></div><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Modul</div><div id="tud-modul" style="font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px"></div><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Digunakan Oleh</div><div id="tud-user" style="font-size:13px;font-weight:600;color:var(--blue);margin-bottom:10px"></div><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Waktu Pemakaian (Mulai s/d Selesai)</div><div id="tud-waktu" style="font-size:12px;color:var(--blue);margin-bottom:10px"></div><div style="font-size:11px;color:var(--text-sub);margin-bottom:2px">Nilai</div><div id="tud-skor" style="font-size:22px;font-weight:800;color:var(--blue)"></div></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" style="flex:1" onclick="_tudOpenReview()">Lihat Review</button><button class="btn btn-secondary" style="flex:1" onclick="closeModal('token-used-data-overlay')">Tutup</button></div></div></div>
