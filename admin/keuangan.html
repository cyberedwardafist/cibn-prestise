  <div class="section-title">Keuangan & Paket</div>
  <div class="section-sub">Kelola paket harga, payment gateway, dan transaksi</div>

  <!-- Sub Tabs -->
  <div class="sub-tabs">
    <button class="sub-tab active" data-sub="paket" onclick="renderKeuanganSub('paket')">Paket Harga</button>
    <button class="sub-tab" data-sub="gateway" onclick="renderKeuanganSub('gateway')">Payment Gateway</button>
    <button class="sub-tab" data-sub="transaksi" onclick="renderKeuanganSub('transaksi')">Transaksi</button>
  </div>

  <!-- PAKET -->
  <div class="sub-page active" id="sub-keuangan-paket">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-sub)">Paket yang tampil di landing page & digunakan saat checkout</span>
      <button class="btn btn-primary btn-sm" onclick="openAddPaket()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Paket Baru</button>
    </div>
    <div id="paket-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px"></div>
  </div>

  <!-- GATEWAY -->
  <div class="sub-page" id="sub-keuangan-gateway">
    <div class="card" style="margin-bottom:14px">
      <div style="font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Midtrans</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Server Key</label><input id="gw-midtrans-sk" class="form-input" type="password" placeholder="SB-Mid-server-xxxx" oninput="setDirty('payment gateway')"><div style="font-size:10px;color:var(--text-sub);margin-top:4px">Simpan untuk transaksi live. Jangan share ke siapapun.</div></div>
        <div class="form-group"><label class="form-label">Client Key</label><input id="gw-midtrans-ck" class="form-input" type="password" placeholder="SB-Mid-client-xxxx" oninput="setDirty()"></div>
      </div>
      <div class="form-group"><label class="form-label">Mode</label>
        <div style="display:flex;gap:8px">
          <label style="display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--gray-border);border-radius:10px;cursor:pointer;flex:1;font-size:13px"><input type="radio" name="midtrans-mode" value="sandbox" checked style="accent-color:var(--blue)"> Sandbox (Testing)</label>
          <label style="display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--gray-border);border-radius:10px;cursor:pointer;flex:1;font-size:13px"><input type="radio" name="midtrans-mode" value="production" style="accent-color:var(--blue)"> Production (Live)</label>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveGateway('midtrans')">Simpan Konfigurasi</button>
    </div>
    <div class="card">
      <div style="font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Xendit</div>
      <div class="form-group"><label class="form-label">Secret Key</label><input id="gw-xendit-sk" class="form-input" type="password" placeholder="xnd_development_xxxx" oninput="setDirty()"></div>
      <div class="form-group"><label class="form-label">Public Key</label><input id="gw-xendit-pk" class="form-input" type="password" placeholder="xnd_public_xxxx" oninput="setDirty()"></div>
      <button class="btn btn-primary" onclick="saveGateway('xendit')">Simpan Konfigurasi</button>
    </div>
  </div>

  <!-- TRANSAKSI -->
  <div class="sub-page" id="sub-keuangan-transaksi">
    <div class="search-bar" style="margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div class="search-input-wrap" style="min-width:150px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" type="text" placeholder="Cari email / paket..." id="trx-search" oninput="filterTrx()"></div>
      <select id="trx-status-filter" class="form-select" style="max-width:160px" onchange="filterTrx()"><option value="">Semua Status</option><option value="success">Success</option><option value="pending">Pending</option><option value="failed">Failed</option></select>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table><thead><tr><th>#</th><th>User / Email</th><th>Paket</th><th class="hide-mobile">Metode</th><th class="hide-mobile">Tgl</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="trx-tbody">
          <tr><td colspan="7"><div class="empty-state"><p>Belum ada transaksi</p></div></td></tr>
        </tbody></table>
      </div>
    </div>
    <div id="trx-pagination"></div>
  </div>
