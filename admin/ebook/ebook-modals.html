<!-- ebook-modul-form-overlay -->
<div class="overlay" id="ebook-modul-form-overlay"><div class="modal modal-lg"><div class="modal-header"><div class="modal-title" id="ebook-modul-form-title">Buat Modul E-Book</div><button class="modal-close" onclick="closeModalCheckDirty('ebook-modul-form-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><input type="hidden" id="ebook-modul-form-mode" value="add"><input type="hidden" id="ebook-modul-form-id" value=""><div class="ebook-poster-preview" id="ebook-modul-poster-preview" onclick="document.getElementById('ebook-modul-poster-input').click()" style="cursor:pointer"></div><div style="text-align:center;margin-bottom:16px"><button type="button" class="btn btn-secondary btn-sm" id="ebook-modul-poster-btn" onclick="document.getElementById('ebook-modul-poster-input').click()">🖼️ Upload Poster</button><input type="file" id="ebook-modul-poster-input" accept="image/*" style="display:none" onchange="onEbookModulPosterSelected(this)"></div><div class="form-group"><label class="form-label">Nama Modul</label><input id="ebook-modul-nama-input" class="form-input" type="text" placeholder="Misal: Paket Akuntansi Dasar" oninput="setDirty('modul e-book')"></div><div class="form-group"><label class="form-label">Kelompok <span style="font-weight:400;color:var(--text-sub)">(opsional)</span></label><select id="ebook-modul-kelompok-select" class="form-input" onchange="setDirty('modul e-book')"><option value="">-- Tanpa Kelompok --</option></select></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><label class="form-label" style="margin-bottom:0" id="ebook-modul-picker-label">Pilih Buku & Urutan Tampil</label><span style="font-size:11px;color:var(--text-sub)" id="ebook-modul-picker-hint">Cari &amp; pilih buku yang ingin dimasukkan ke modul</span></div><div class="search-bar" id="ebook-modul-picker-searchbar" style="flex-wrap:wrap;gap:8px;margin-bottom:10px"><div class="search-input-wrap" style="min-width:150px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" type="text" id="ebook-modul-picker-search-input" placeholder="Cari judul buku..." oninput="_ebookModulPickerSearch=this.value;_renderEbookModulPickerList()"></div><div id="ebook-modul-picker-filters"></div></div><div id="ebook-modul-picker" style="max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModalCheckDirty('ebook-modul-form-overlay')">Batal</button><button class="btn btn-secondary" id="ebook-modul-back-btn" style="display:none" onclick="_ebookModulGoToSelectStep()">&larr; Kembali</button><button class="btn btn-primary" id="ebook-modul-next-btn" onclick="_ebookModulGoToOrderStep()">Atur Urutan</button><button class="btn btn-primary" id="ebook-modul-save-btn" style="display:none" onclick="submitEbookModulForm()">Simpan Modul</button></div></div></div>

<!-- ebook-kelompok-overlay -->
<div class="overlay" id="ebook-kelompok-overlay"><div class="modal"><div class="modal-header"><div class="modal-title">Kelola Kelompok E-Book</div><button class="modal-close" onclick="closeModal('ebook-kelompok-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <input id="ebook-kelompok-new-input" class="form-input" type="text" placeholder="Nama kelompok baru" onkeydown="if(event.key==='Enter')addEbookKelompok()">
    <button class="btn btn-primary" style="flex-shrink:0" onclick="addEbookKelompok()">Tambah</button>
  </div>
  <div id="ebook-kelompok-manage-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('ebook-kelompok-overlay')">Tutup</button></div>
</div></div>

<!-- ebook-modul-kelompok-overlay -->
<div class="overlay" id="ebook-modul-kelompok-overlay"><div class="modal"><div class="modal-header"><div class="modal-title">Kelola Kelompok Modul E-Book</div><button class="modal-close" onclick="closeModal('ebook-modul-kelompok-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <input id="ebook-modul-kelompok-new-input" class="form-input" type="text" placeholder="Nama kelompok baru" onkeydown="if(event.key==='Enter')addEbookModulKelompok()">
    <button class="btn btn-primary" style="flex-shrink:0" onclick="addEbookModulKelompok()">Tambah</button>
  </div>
  <div id="ebook-modul-kelompok-manage-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('ebook-modul-kelompok-overlay')">Tutup</button></div>
</div></div>
