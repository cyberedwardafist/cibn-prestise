<!-- ebook-modul-form-overlay -->
<div class="overlay" id="ebook-modul-form-overlay"><div class="modal modal-lg"><div class="modal-header"><div class="modal-title" id="ebook-modul-form-title">Buat Modul E-Book</div><button class="modal-close" onclick="closeModal('ebook-modul-form-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><input type="hidden" id="ebook-modul-form-mode" value="add"><input type="hidden" id="ebook-modul-form-id" value=""><div class="form-group"><label class="form-label">Nama Modul</label><input id="ebook-modul-nama-input" class="form-input" type="text" placeholder="Misal: Paket Akuntansi Dasar" oninput="setDirty('modul e-book')"></div><div class="form-group"><label class="form-label">Kelompok <span style="font-weight:400;color:var(--text-sub)">(opsional)</span></label><select id="ebook-modul-kelompok-select" class="form-input" onchange="setDirty('modul e-book')"><option value="">-- Tanpa Kelompok --</option></select></div><label class="form-label">Pilih Buku</label><div id="ebook-modul-picker" style="max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:6px"></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('ebook-modul-form-overlay')">Batal</button><button class="btn btn-primary" onclick="submitEbookModulForm()">Simpan Modul</button></div></div></div>

<!-- ebook-kelompok-overlay -->
<div class="overlay" id="ebook-kelompok-overlay"><div class="modal"><div class="modal-header"><div class="modal-title">Kelola Kelompok E-Book</div><button class="modal-close" onclick="closeModal('ebook-kelompok-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <input id="ebook-kelompok-new-input" class="form-input" type="text" placeholder="Nama kelompok baru" onkeydown="if(event.key==='Enter')addEbookKelompok()">
    <button class="btn btn-primary" style="flex-shrink:0" onclick="addEbookKelompok()">Tambah</button>
  </div>
  <div id="ebook-kelompok-manage-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('ebook-kelompok-overlay')">Tutup</button></div>
</div></div>

<!-- ebook-modul-kelompok-overlay -->
<div class="overlay" id="ebook-modul-kelompok-overlay"><div class="modal"><div class="modal-header"><div class="modal-title">Kelola Kelompok Modul E-Book</div><button class="modal-close" onclick="closeModal('ebook-modul-kelompok-overlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <input id="ebook-modul-kelompok-new-input" class="form-input" type="text" placeholder="Nama kelompok baru" onkeydown="if(event.key==='Enter')addEbookModulKelompok()">
    <button class="btn btn-primary" style="flex-shrink:0" onclick="addEbookModulKelompok()">Tambah</button>
  </div>
  <div id="ebook-modul-kelompok-manage-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto"></div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('ebook-modul-kelompok-overlay')">Tutup</button></div>
</div></div>
