<!-- ══ MANAGEMENT > GURU ══
     Slide dock kedua dari dock utama "MANAGEMENT" (management guru).
     Page ID: management-guru — didaftarkan di SIDE_DOCK_GROUPS.management
     (admin/index_admin.html), panel #side-dock-wrap sama dgn slide MATERI
     (gantian, sesuai pola grup CAT/SOAL/EBOOK/ANALISA). File sendiri
     (fragmen + JS terpisah dari slide MATERI). Logic ada di
     admin/management/guru.js.

     Isi halaman ini: tombol "+ Materi" -> buka HALAMAN (bukan popup, lihat
     admin/management/guru-paket-form.html) buat bikin/edit satu "grup"
     (nama + nama_internal + daftar akun guru/review + daftar materi yang
     jadi tanggung jawabnya). Daftar grup yg sudah dibuat ditampilkan di
     bawah, DIKELOMPOKKAN PER MATERI — satu grup yang terhubung ke >1 materi
     akan muncul berulang di tiap bagian materi terkait, supaya gampang cek
     "materi X isinya guru siapa aja" sekali pandang.

     Search bar paling atas beda dari search-bar list biasa: bisa cari nama
     GURU/REVIEW *atau* nama GRUP/MATERI sekaligus (lihat _guruTopSearchInput()
     di guru.js). Kalau hasil cocok ke nama guru, muncul dropdown berisi nama
     guru itu + baris "Ikut di materi: ..."; diklik -> kalau guru itu cuma ada
     di 1 grup langsung dibuka, kalau di >1 grup muncul popup pilih mau ke
     grup/materi yang mana (modal #guru-pilih-grup-overlay, ada di
     admin/management/guru-modals.html). -->

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px">
  <div class="section-title" style="margin-bottom:0">Guru</div>
  <button class="btn btn-primary" onclick="openAddGuruPaketGrup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Materi</button>
</div>
<div class="section-sub">Kelola grup guru/review per materi — satu materi bisa punya banyak guru, satu guru boleh ada di banyak materi.</div>

<div class="search-bar" style="position:relative">
  <div class="search-input-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" type="text" id="guru-top-search-input" placeholder="Cari nama guru/review, atau nama grup/materi..."
      oninput="_guruTopSearchInput(this.value)" onfocus="_guruTopSearchInput(this.value)">
  </div>
  <div id="guru-top-search-results" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#fff;border:1px solid rgba(19,50,89,0.12);border-radius:10px;box-shadow:0 10px 28px -12px rgba(19,50,89,0.28);max-height:320px;overflow-y:auto"></div>
</div>

<div id="guru-paket-grup-list"></div>

<div class="card" id="mgmt-guru-empty" style="display:none">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <p>Belum ada grup guru/materi. Tekan tombol "+ Materi" di atas untuk membuat yang pertama.</p>
  </div>
</div>
