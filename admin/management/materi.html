<!-- ══ MANAGEMENT > MATERI ══
     Slide dock pertama dari dock utama "MANAGEMENT" (management guru).
     Page ID: management-materi — didaftarkan di SIDE_DOCK_GROUPS.management
     (admin/index_admin.html) supaya dapat panel #side-dock-wrap yg sama dgn
     grup CAT/SOAL/EBOOK/ANALISA (bergantian, tidak pernah dibuka bersamaan).
     File sendiri (fragmen + JS terpisah dari slide GURU), sesuai pola CAT
     (token.html/laporan.html/review.html masing2 file sendiri). Logic ada
     di admin/management/materi.js. Modal "Buat/Edit Materi" ada di
     admin/management/management-modals.html (didaftarkan sbg 'modals' di
     ADMIN_PAGE_MODULES['management-materi'], js/app.js).

     Satu "materi" = nama + daftar modul (dari bank modul CAT/SOAL yg sudah
     ada) dengan urutan tampilnya sendiri — pola CRUD-nya sama persis dgn
     "Modul E-Book" (admin/ebook/ebook-modul.html), cuma isinya modul,
     bukan buku. Kartu list pakai class .modul-card (sama dgn Manajemen
     Modul) + versi swipe utk mobile (edit=swipe-kiri, hapus=swipe-kanan).

     Daftar materi dikelompokkan per GRUP materi sendiri (kolom materi.kelompok,
     opsional, dikelola lewat tombol "Kelola Grup" -> materi-kelompok-overlay di
     management-modals.html) — pola render grup (header nama grup + kartu2 di
     dalamnya) sama persis dgn Manajemen Modul (admin/soal/modul.html:
     #modul-groups). #materi-list di bawah diisi PENUH oleh _renderMateriList()
     (js), sudah termasuk .aksi-swipe-wrap & .swipe-list per grup di dalamnya —
     makanya cuma 1 div kosong di sini, beda dari pola lama (2 div terpisah). -->

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px">
  <div class="section-title" style="margin-bottom:0">Materi</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div id="materi-kelompok-filters"></div>
    <button class="btn btn-secondary" onclick="openManageMateriKelompok()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Kelola Grup</button>
    <button class="btn btn-primary" onclick="openAddMateri()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Materi</button>
  </div>
</div>
<div class="section-sub">Susun modul menjadi satu materi untuk guru.</div>

<div id="materi-list"></div>
