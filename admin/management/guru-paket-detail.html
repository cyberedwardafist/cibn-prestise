<!-- ══ MANAGEMENT > GURU > DETAIL GRUP ══
     HALAMAN (bukan popup — page ID 'management-guru-paket-detail', file
     sendiri) yang menampilkan 1 grup: paket-paket terkait + daftar akun
     guru/review-nya, lengkap dengan search untuk cari guru DI DALAM grup
     ini. Dibuka dari klik kartu grup di guru.html atau dari hasil pencarian
     (search bar atas / popup pilih grup). window._guruPaketDetailKode diisi
     kode grup sebelum navigateTo() ke sini.
     Logic ada di admin/management/guru-paket-detail.js. -->

<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
  <button class="btn-icon" onclick="navigateTo('management-guru')" title="Kembali ke daftar Guru">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <div class="section-title" style="margin-bottom:0;flex:1" id="gpd-title">-</div>
  <button class="btn btn-secondary" id="gpd-edit-btn" onclick="_gpdEdit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit</button>
  <button class="btn btn-danger" id="gpd-delete-btn" onclick="_gpdDelete()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg> Hapus</button>
</div>
<div class="section-sub" id="gpd-subtitle">-</div>

<div class="card" style="margin-top:14px">
  <div style="font-weight:700;font-size:13px;color:var(--blue);margin-bottom:8px">Paket Terkait</div>
  <div id="gpd-paket-badges" style="display:flex;gap:8px;flex-wrap:wrap"></div>
</div>

<div class="card" style="margin-top:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div style="font-weight:700;font-size:13px;color:var(--blue)">Guru / Review (<span id="gpd-guru-count">0</span>)</div>
  </div>
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" id="gpd-guru-search-input" placeholder="Cari guru/review di grup ini..." oninput="_gpdSearch=this.value;_gpdRenderGuruList()">
    </div>
  </div>
  <div id="gpd-guru-list" style="display:flex;flex-direction:column;gap:6px;margin-top:10px"></div>
</div>
