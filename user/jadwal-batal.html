<!-- ══════════════════════════════════════════════════════════════════════
     user/jadwal-batal.html — KONFIRMASI: BATALKAN JADWAL, + info tanggal
     yang sudah lewat (tidak bisa dipilih di kalender). Keduanya dialog kecil
     di tengah layar (bukan overlay-fullscreen), dipicu dari tombol Batal di
     kartu list (user/jadwal.html) atau dari tap tanggal lampau di kalender.
     ══════════════════════════════════════════════════════════════════════ -->
<div class="overlay confirm-overlay" id="jdw-batal-overlay" onclick="if(event.target===this){this.classList.remove('open');_jdwSyncPageScrollLock();}">
  <div class="modal" style="max-width:300px;text-align:center">
    <div class="confirm-icon danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <div class="confirm-title">Batalkan Jadwal?</div>
    <div class="confirm-msg">Jadwal yang dibatalkan tidak bisa dikembalikan.</div>
    <div class="confirm-btns">
      <button class="btn-secondary" onclick="document.getElementById('jdw-batal-overlay').classList.remove('open');_jdwSyncPageScrollLock()" style="flex:1;padding:11px">Tidak</button>
      <button class="btn-primary" onclick="JadwalPage.confirmBatal()" style="flex:1;margin-top:0">Ya, Batalkan</button>
    </div>
  </div>
</div>

<!-- ══════ INFO: TANGGAL SUDAH LEWAT (tidak bisa dipilih di kalender) ══════ -->
<div class="overlay confirm-overlay" id="jdw-lewat-overlay" onclick="if(event.target===this){this.classList.remove('open');_jdwSyncPageScrollLock();}">
  <div class="modal" style="max-width:300px;text-align:center">
    <div class="confirm-icon warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
    <div class="confirm-title">Tidak Bisa Dipilih</div>
    <div class="confirm-msg">Tidak bisa dipilih karena sudah lewat hari.</div>
    <div class="confirm-btns">
      <button class="btn-primary" onclick="document.getElementById('jdw-lewat-overlay').classList.remove('open');_jdwSyncPageScrollLock()" style="flex:1;margin-top:0">Kembali</button>
    </div>
  </div>
</div>
