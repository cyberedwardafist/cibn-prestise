<!-- ══════════════════════════════════════════════════════════════════════
     user/jadwal.html — SHELL utama tab Jadwal.
     Cuma isi tampilan LIST (header, kalender, toggle Minggu Ini/
     Riwayat, daftar status). Semua overlay/halaman aksi (Ajukan Jadwal /
     Jadwal Ulang / Edit, Pilih Tentor, Sesi Masuk-Feedback, Batalkan Jadwal)
     SUDAH DIPISAH ke file terpisah, lihat:
       - user/jadwal-ajukan.html  (overlay Ajukan Jadwal / Jadwal Ulang / Edit)
       - user/jadwal-tentor.html  (overlay Pilih Tentor)
       - user/jadwal-sesi.html    (overlay Sesi Berlangsung / Feedback)
       - user/jadwal-batal.html   (konfirmasi Batalkan Jadwal + info tanggal lewat)
     Kelimanya di-fetch bareng (lihat USER_PAGE_MODULES.jadwal di index_user.html)
     lalu di-gabung jadi satu container #page-jadwal — file ini dimuat DULUAN
     (isi utuh container), baru overlay-overlay di atas di-APPEND sesudahnya,
     supaya nggak saling timpa. ══════════════════════════════════════════ -->
<div class="jadwal-header-row">
  <div class="jadwal-title">Jadwal Mentoring</div>
  <!-- Dulu di sini ada tombol "Reset Dummy" + "Refresh" (class=jadwal-refresh-btn),
       sekarang diganti badge KUOTA PENGAJUAN — sisa slot pengajuan jadwal yang
       masih bisa diajukan user (lihat JDW_KUOTA_TOTAL/_jdwKuotaSisa/_jdwRenderKuota
       di user/jadwal.js). Angka otomatis update tiap ada perubahan status
       pengajuan (disetujui/menunggu = ngurangin, dibatalkan/ditolak/selesai =
       balik nambah), tanpa perlu refresh manual. -->
  <!-- Badge kedua KUOTA PEMBATALAN — jatah membatalkan jadwal yang sudah
       disetujui (acc), maksimal 3x (lihat JDW_KUOTA_BATAL_TOTAL/
       _jdwKuotaBatalSisa/_jdwRenderKuota di user/jadwal.js). Pembatalan pada
       jadwal yang statusnya BELUM di-acc (masih menunggu) TIDAK memotong
       kuota ini sama sekali — cuma jadwal yang sudah disetujui yang
       dihitung. Pembatalan langsung setelah tentor mengajukan jadwal ulang
       (disetujui ATAU ditolak sekalipun) juga dikecualikan (gratis, tidak
       memotong kuota ini) — lihat catatan freeCancelEligible di
       JadwalPage.tolakResejuel/setujuResejuel & JadwalPage.submitBatalPengajuan. -->
  <div class="jadwal-kuota-group">
    <div class="jadwal-kuota-badge" title="Sisa kuota pengajuan jadwal yang masih bisa kamu ajukan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Kuota: <strong id="jdw-kuota-value">-/-</strong></span>
    </div>
    <div class="jadwal-kuota-badge batal" title="Sisa jatah membatalkan jadwal yang sudah disetujui (maksimal 3x)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>Batal: <strong id="jdw-kuota-batal-value">-/-</strong></span>
    </div>
  </div>
</div>

<!-- Kalender bisa dibuka jadi tampilan SEBULAN lewat tombol "1 Bulan" di
     pojok kanan (JadwalPage.toggleCalendarExpand) — begitu kebuka, caption
     minggu diganti nav bulan (id=jdw-cal-nav) + grid 6x7 (id=jdw-month-grid),
     strip minggu di-hide. Tanggal "numpang lewat" dari bulan lain & tanggal
     yang sudah lewat SAMA-SAMA tidak bisa diklik (lihat _jdwMonthGridHtml
     di jadwal.js). Tombol bisa ditutup lagi buat balik ke strip minggu biasa. -->
<div class="glass jdw-week-card">
  <div class="jdw-week-caption-row">
    <div class="jdw-week-caption" id="jdw-week-caption">Minggu ini</div>
    <button type="button" class="jdw-cal-toggle-btn" id="jdw-cal-toggle-btn" onclick="JadwalPage.toggleCalendarExpand()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      <span id="jdw-cal-toggle-label">1 Bulan</span>
    </button>
  </div>
  <div class="jdw-riwayat-nav" id="jdw-cal-nav" style="display:none">
    <button type="button" class="jdw-icon-btn" id="jdw-cal-prev-btn" onclick="JadwalPage.calendarMonthNav('older')" aria-label="Bulan sebelumnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="jdw-riwayat-caption" id="jdw-cal-month-caption">-</div>
    <button type="button" class="jdw-icon-btn" onclick="JadwalPage.calendarMonthNav('newer')" aria-label="Bulan berikutnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="jdw-week-strip" id="jdw-week-strip"></div>
  <div class="jdw-month-grid" id="jdw-month-grid" style="display:none"></div>
</div>
<div class="jdw-week-hint">Ketuk salah satu tanggal untuk atur jadwal mentoring kamu</div>

<!-- ══════ TOGGLE: MINGGU INI / RIWAYAT ══════ -->
<div class="jdw-view-toggle" id="jdw-view-toggle">
  <button type="button" class="jdw-view-btn active" data-view="minggu" onclick="JadwalPage.setView('minggu')">Minggu Ini</button>
  <button type="button" class="jdw-view-btn" data-view="riwayat" onclick="JadwalPage.setView('riwayat')">Riwayat</button>
</div>
<div class="jdw-riwayat-nav" id="jdw-riwayat-nav" style="display:none">
  <button type="button" class="jdw-icon-btn" id="jdw-riwayat-prev-btn" onclick="JadwalPage.riwayatNav('older')" aria-label="Minggu sebelumnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="jdw-riwayat-caption" id="jdw-riwayat-caption">-</div>
  <button type="button" class="jdw-icon-btn" id="jdw-riwayat-next-btn" onclick="JadwalPage.riwayatNav('newer')" aria-label="Minggu berikutnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<!-- ══════ LIST: PENGAJUAN MENUNGGU/DISETUJUI, DIPISAH PER HARI ══════
     Kartu di sini pakai swipe-card (lihat js/swipe.js): geser kartu buat
     nongolin tombol aksi (Edit/Jadwal Ulang di kiri, Batal di kanan). Jarak
     aman di bawah supaya tombol-tombol itu (termasuk pas kartu paling bawah
     di-geser) TIDAK ketutupan dock mengambang diatur lewat padding-bottom
     #page-jadwal (lihat blok <style> index_user.html, sama pola kayak
     #page-profil yang juga ngitung env(safe-area-inset-bottom)).
     Entri berstatus "resejuel" (jadwal ulang dari tentor) TIDAK punya
     banner terpisah lagi — tampil normal di list tanggal jadwal lama-nya
     kayak status lain, tombol aksinya "Cek" buka halaman fullscreen
     bandingkan jadwal lama vs baru (lihat #jdw-resejuel-overlay di
     user/jadwal-batal.html & JadwalPage.bukaResejuel di user/jadwal.js). -->
<div class="jdw-status-list" id="jdw-status-list"></div>
