<!-- ══════════════════════════════════════════════════════════════════════
     user/jadwal-ajukan.html — overlay HALAMAN: AJUKAN JADWAL.
     Satu form ini DIPAKAI BARENG untuk 3 aksi (Ajukan Jadwal baru / Jadwal
     Ulang / Edit pengajuan) karena isinya memang sama persis (pilih tentor +
     jam + materi) — bedanya cuma judul & seksi tambahan yang di-toggle lewat
     JS (JadwalPage.openAjukanOverlay), BUKAN diduplikasi jadi 3 file terpisah,
     supaya logikanya tetap satu sumber (lihat catatan di user/jadwal.js
     sekitar JadwalPage.editingId / _isReschedule).
     Sekarang ini yang langsung kebuka begitu tanggal di kalender di-tap, atau
     tombol Edit/Jadwal Ulang di kartu list (user/jadwal.html) ditap.
     Isi "lihat jadwal tanggal ini" (dulu di overlay detail-tanggal terpisah)
     sudah dipindah ke depan -> ke id="jdw-status-list" di user/jadwal.html. -->
<div class="overlay overlay-fullscreen" id="jdw-ajukan-overlay">
  <div class="modal modal-fullscreen">
    <div class="jdw-modal-header">
      <button class="jdw-icon-btn" onclick="JadwalPage.closeAjukanOverlay()" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="jdw-modal-title" id="jdw-ajukan-title">Ajukan Jadwal</div>
      <span style="width:32px"></span>
    </div>
    <div class="jdw-modal-body">
      <!-- Cuma nongol pas mode JADWAL ULANG (status entri "acc") — pilih tanggal
           baru dulu sebelum pilih jam, biar bisa dipindah ke hari lain. -->
      <div class="jdw-form-section" id="jdw-reschedule-date-section" style="display:none">
        <div class="jdw-form-label">Pilih Tanggal</div>
        <div class="glass jdw-week-card" style="padding:14px 10px 10px;margin-bottom:0">
          <div class="jdw-riwayat-nav" style="margin-bottom:10px">
            <button type="button" class="jdw-icon-btn" onclick="JadwalPage.rescheduleWeekNav('older')" aria-label="Minggu sebelumnya">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="jdw-riwayat-caption" id="jdw-reschedule-caption">-</div>
            <button type="button" class="jdw-icon-btn" onclick="JadwalPage.rescheduleWeekNav('newer')" aria-label="Minggu berikutnya">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <div class="jdw-week-strip" id="jdw-reschedule-strip"></div>
        </div>
      </div>
      <div class="jdw-form-section">
        <div class="jdw-form-label">Pilih Tentor</div>
        <div class="jdw-tentor-picker" id="jdw-tentor-picker"></div>
      </div>
      <div class="jdw-form-section">
        <div class="jdw-form-label">Pilih Jam</div>
        <div class="jdw-chip-grid" id="jdw-slot-grid"></div>
      </div>
      <div class="jdw-form-section">
        <div class="jdw-form-label">Pilih Materi</div>
        <div class="jdw-materi-grid" id="jdw-materi-grid"></div>
      </div>
      <!-- Cuma nongol pas mode JADWAL ULANG — wajib diisi sebelum bisa ajukan. -->
      <div class="jdw-form-section" id="jdw-reschedule-alasan-section" style="display:none">
        <div class="jdw-form-label">Alasan Pengajuan</div>
        <textarea class="jdw-textarea" id="jdw-reschedule-alasan" placeholder="Tulis alasan kamu mengajukan jadwal ulang..." oninput="JadwalPage._refreshSubmitBtn()"></textarea>
      </div>
      <!-- Tombol ajukan ikut ada DI DALAM area scroll (bukan footer sticky lagi) —
           jadi tombol ini ikut ke-scroll bareng form di atasnya, dan posisi
           akhirnya ada di paling bawah konten, di atas dock utama (jarak bawah
           diatur lewat padding-bottom #jdw-ajukan-overlay .jdw-modal-body,
           yang sudah ikut ngitung env(safe-area-inset-bottom) juga). Overlay
           fullscreen ini z-index-nya di atas dock (lihat .overlay), jadi dock
           utama otomatis ketutup penuh selama halaman ini kebuka. -->
      <div class="jdw-form-section jdw-ajukan-submit-section" style="margin-bottom:0">
        <button class="jdw-btn jdw-btn-primary jdw-btn-block" id="jdw-submit-btn" onclick="JadwalPage.submitAjukan()" disabled>AJUKAN</button>
      </div>
    </div>
  </div>
</div>
