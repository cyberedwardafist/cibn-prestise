<!-- ══════════════════════════════════════════════════════════════════════
     user/jadwal.html — SHELL utama tab Jadwal.
     Cuma isi tampilan LIST (header, 2 kalender minggu, toggle Minggu Ini/
     Riwayat, daftar status). Semua overlay/halaman aksi (Ajukan Jadwal /
     Jadwal Ulang / Edit, Pilih Tentor, Sesi Masuk-Feedback, Batalkan Jadwal)
     SUDAH DIPISAH ke file terpisah, lihat:
       - user/jadwal-ajukan.html  (overlay Ajukan Jadwal / Jadwal Ulang / Edit)
       - user/jadwal-tentor.html  (overlay Pilih Tentor)
       - user/jadwal-sesi.html    (overlay Sesi Berlangsung / Feedback)
       - user/jadwal-batal.html   (konfirmasi Batalkan Jadwal + info tanggal lewat)
     Kelimanya di-fetch bareng (lihat USER_PAGE_MODULES.jadwal di index_user.html)
     lalu di-gabung jadi satu container #page-jadwal — file ini dimuat DULUAN
     (isi utuh container), baru overlay-overlay di atas di-APPEND sesudahnya,
     supaya nggak saling timpa. ══════════════════════════════════════════ -->
<div class="jadwal-header-row">
  <div class="jadwal-title">Jadwal Mentoring</div>
  <button class="jadwal-refresh-btn" onclick="loadJadwal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    Refresh
  </button>
</div>

<div class="glass jdw-week-card">
  <div class="jdw-week-caption" id="jdw-week-caption">Minggu ini</div>
  <div class="jdw-week-strip" id="jdw-week-strip"></div>
</div>
<div class="jdw-week-hint">Ketuk salah satu tanggal untuk atur jadwal mentoring kamu</div>

<!-- Kalender ke-2: khusus buat ajukan jadwal MINGGU DEPAN, cuma nongol pas
     hari ini adalah hari Minggu. Begitu hari Minggu ini lewat (masuk hari
     Senin), kalender ini otomatis hilang lagi (tinggal 1 kalender di atas). -->
<div class="glass jdw-week-card" id="jdw-nextweek-card" style="display:none">
  <div class="jdw-week-caption">Ajukan minggu depan</div>
  <div class="jdw-week-strip" id="jdw-nextweek-strip"></div>
</div>
<div class="jdw-week-hint" id="jdw-nextweek-hint" style="display:none">Ketuk salah satu tanggal minggu depan untuk ajukan lebih awal</div>

<!-- ══════ TOGGLE: MINGGU INI / RIWAYAT ══════ -->
<div class="jdw-view-toggle" id="jdw-view-toggle">
  <button type="button" class="jdw-view-btn active" data-view="minggu" onclick="JadwalPage.setView('minggu')">Minggu Ini</button>
  <button type="button" class="jdw-view-btn" data-view="riwayat" onclick="JadwalPage.setView('riwayat')">Riwayat</button>
</div>
<div class="jdw-riwayat-nav" id="jdw-riwayat-nav" style="display:none">
  <button type="button" class="jdw-icon-btn" onclick="JadwalPage.riwayatNav('older')" aria-label="Minggu sebelumnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="jdw-riwayat-caption" id="jdw-riwayat-caption">-</div>
  <button type="button" class="jdw-icon-btn" id="jdw-riwayat-next-btn" onclick="JadwalPage.riwayatNav('newer')" aria-label="Minggu berikutnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<!-- ══════ LIST: PENGAJUAN MENUNGGU/DISETUJUI, DIPISAH PER HARI ══════
     Kartu di sini pakai swipe-card (lihat js/swipe.js): geser kartu buat
     nongolin tombol aksi (Edit/Jadwal Ulang di kiri, Batal di kanan). Jarak
     aman di bawah supaya tombol-tombol itu (termasuk pas kartu paling bawah
     di-geser) TIDAK ketutupan dock mengambang diatur lewat padding-bottom
     #page-jadwal (lihat blok <style> index_user.html, sama pola kayak
     #page-profil yang juga ngitung env(safe-area-inset-bottom)). -->
<div class="jdw-status-list" id="jdw-status-list"></div>
