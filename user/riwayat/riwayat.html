  <div class="history-header-row">
    <div class="history-title">Riwayat Ujian</div>
    <div style="position:relative">
      <button class="filter-btn" onclick="toggleFilter()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filter
      </button>
      <div class="filter-dropdown" id="filter-dropdown">
        <div class="filter-opt selected" onclick="applyFilter('semua',this)">Semua</div>
        <div class="filter-opt" onclick="applyFilter('hari-ini',this)">Hari Ini</div>
        <div class="filter-opt" onclick="applyFilter('minggu',this)">Minggu Ini</div>
        <div class="filter-opt" onclick="applyFilter('bulan',this)">Bulan Ini</div>
        <div class="filter-opt filter-opt-range" onclick="openDateRange()">
          <span style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Range Tanggal</span>
        </div>
      </div>
    </div>
  </div>
  <div class="history-grid" id="history-grid">
    <div class="empty-riwayat" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>Memuat riwayat...</p></div>
  </div>

  <!-- DateRange modal -->
  <div class="daterange-overlay" id="daterange-overlay" onclick="if(event.target===this)closeDateRange()">
    <div class="daterange-modal">
      <button class="modal-close" onclick="closeDateRange()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div style="font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--blue);margin-bottom:16px">Pilih Rentang Tanggal</div>
      <div class="form-group"><label class="form-label">Dari</label><input type="date" id="date-from" class="form-input"></div>
      <div class="form-group"><label class="form-label">Sampai</label><input type="date" id="date-to" class="form-input"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn-secondary" onclick="closeDateRange()" style="flex:1;padding:11px">Batal</button>
        <button class="btn-primary" onclick="applyDateRange()" style="flex:1.4;margin-top:0">Terapkan</button>
      </div>
    </div>
  </div>
